- target:
    kind: ingredient
    id: cheddar-cheese
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cheddar is a firm cheese made by working and pressing curd, then maturing it. It is sliced, grated or
        melted in cooking, with the chosen age affecting texture and flavour.
      sources:
        - dairy-cheddar
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Younger cheddar is milder and generally slices more readily; older cheddar can be sharper and more
        crumbly. Choose according to the flavour and texture wanted.
      sources:
        - dairy-cheddar
      review_version: 0.1
    - id: uses
      role: uses
      text: A mild slicing cheese and a crumbly mature piece offer different results on the plate. Age words are
        useful clues, but check the particular cheese rather than treating them as identical across producers.
      sources:
        - dairy-cheddar
      review_version: 0.1
    - id: context
      role: context
      text: Clothbound, waxed and rindless cheeses mature in different coverings. These are product distinctions,
        not proof that one style is best for every use.
      sources:
        - dairy-cheddar
      review_version: 0.1
  resources:
    - resource: dairy-cheddar
      role: introduction
      order: 1
      review_version: 0.1
