- target:
    kind: ingredient
    id: chickpeas
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Chickpeas are the edible seeds of a legume, sold dried or cooked. They are used whole in dishes or
        mashed into preparations such as hummus.
      sources:
        - pulses-cook
        - kew-chickpea
      review_version: 0.1
    - id: uses
      role: uses
      text: Cooked chickpeas can remain whole or be mashed into a softer mixture. Choose the finished tenderness for
        the dish instead of applying one cooking time to every batch.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: context
      role: context
      text: Soaked is not the same as cooked. When swapping dried and tinned chickpeas, check whether the recipe’s
        quantity describes the dry ingredient or the cooked, drained amount.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: storage
      role: storage
      text: For refrigerated or frozen cooked chickpeas, retaining some cooking liquid helps prevent drying. Follow
        appropriate cooling and storage guidance for the prepared dish.
      sources:
        - pulses-cook
      review_version: 0.1
  resources:
    - resource: pulses-cook
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: commonly-used-with
      target:
        kind: equipment
        id: pressure-cooker
      note: One cooking option for dried chickpeas; follow the cooker’s pulse instructions and fill limits.
      sources:
        - pulses-cook
      review_version: 0.1
