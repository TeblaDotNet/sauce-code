- target:
    kind: ingredient
    id: olive-oil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: "Olive oil is obtained from olives and used in dressings and cooking. The label matters: extra virgin
        and refined-oil blends are different product categories."
      sources:
        - ioc-oil
      review_version: 0.1
    - id: context
      role: context
      text: Virgin oils are produced by mechanical or physical methods. Under International Olive Council
        terminology, the category labelled olive oil is a blend of refined and virgin olive oils; retail
        wording can vary by country.
      sources:
        - ioc-oil
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose the oil for its flavour and intended use rather than assuming every bottle behaves identically.
        The general name alone does not establish a universal frying temperature.
      sources:
        - ioc-oil
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep the container closed and protect it from light and excessive heat. Buy an amount that suits how
        quickly you use it.
      sources:
        - ioc-oil
      review_version: 0.1
