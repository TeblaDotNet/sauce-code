    id: chef-knife
  review_version: 0.1
  hero:
    asset: "references/chef-knife.jpg"
    title: "Chef's Knife.jpg"
    source_page: "https://commons.wikimedia.org/wiki/File:Chef%27s_Knife.jpg"
    source_file: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Chef%27s_Knife.jpg"
    creator: "Donovan Govan"
    licence: "CC BY-SA 3.0"
    licence_url: "https://creativecommons.org/licenses/by-sa/3.0/"
    attribution_text: "Chef's Knife.jpg — Donovan Govan"
    alt: "A chef knife with a broad steel blade and black riveted handle."
    reviewed_at: "2026-10-11"
    width: 960
    height: 158
    changes: "Resized by Wikimedia Commons; full frame retained."
    caption: "A representative chef knife."
  editorial:
    - id: summary
      role: summary
      text: A chef knife is a general-purpose preparation knife used for many chopping and slicing tasks. Its longer
        blade can suit larger ingredients; smaller delicate work may suit a paring knife.
      sources:
        - cia-knives
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose for the task, a comfortable secure grip and maintainability. A recipe does not require purchasing
        this exact knife pattern if an appropriate tool is already available. Construction labels alone do not
        establish a universal quality ranking.
      sources:
        - cia-knives
      review_version: 0.1
    - id: care
      role: care
      text: Manufacturer guidance recommends prompt hand-washing, careful drying and protected storage. Follow the
        instructions for your own knife; do not generalise a sharpening angle or care schedule to every
        material.
      sources:
        - wusthof-care
      review_version: 0.1
    - id: tasks
      role: uses
      text: A chef knife can suit chopping, slicing, dicing and mincing. Choose another suitable tool
        when the task calls for it.
      sources:
        - cia-knives
      review_version: 0.1
  resources:
    - resource: cia-knives
      role: introduction
      order: 1
      review_version: 0.1
    - resource: wusthof-care
      role: maintenance
      order: 2
      note: Manufacturer care source; not a product recommendation.
      review_version: 0.1
    - resource: cia-tutorials
      role: technique-demonstration
      order: 3
      note: Landing-page topics checked. Individual videos not watched; duration and captions unverified.
      review_version: 0.1
