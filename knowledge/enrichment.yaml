- target:
    kind: equipment
    id: frying-pan
  review_version: 0.1
  hero:
    asset: "references/frying-pan.jpg"
    title: "Frying pan with black handle.jpg"
    source_page: "https://commons.wikimedia.org/wiki/File:Frying_pan_with_black_handle.jpg"
    source_file: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Frying_pan_with_black_handle.jpg"
    creator: "Lcarsdata"
    licence: "CC BY-SA 3.0"
    licence_url: "https://creativecommons.org/licenses/by-sa/3.0/"
    attribution_text: "Frying pan with black handle.jpg — Lcarsdata"
    alt: "An empty frying pan with a dark cooking surface and black handle."
    reviewed_at: "2026-10-11"
    width: 960
    height: 620
    changes: "Resized by Wikimedia Commons; full frame retained."
    caption: "A representative frying pan."
  editorial:
    - id: summary
      role: summary
      text: A frying pan provides a cooking surface for tasks such as frying and browning. Choose a pan suited to
        the food, heat source and intended method.
      sources:
        - allclad-care
      review_version: 0.1
    - id: materials
      role: context
      text: Frying pans come in cast-iron, carbon-steel, stainless-steel and non-stick designs. Their
        cooking and care needs differ. Cooking surface, construction and product
        limits matter; no material is best for every task.
      sources:
        - allclad-care
        - tefal-care
        - lodge-care
      review_version: 0.1
    - id: selection
      role: selection
      text: For a sear or a delicate sticking-prone food, consider the intended surface behaviour and the pan
        instructions. A non-stick coating does not grant unlimited heat tolerance. Another suitable vessel may
        work for a particular recipe, but equivalence is task-dependent.
      sources:
        - tefal-care
        - cia-sear
      review_version: 0.1
    - id: care
      role: care
      text: Seasoned cast iron has seasoning-specific care. Stainless and coated cookware require their own cleaning
        guidance; prolonged overheating can damage non-stick performance. Follow the material and collection
        instructions rather than one rule for all frying pans.
      sources:
        - lodge-care
        - allclad-care
        - tefal-care
      review_version: 0.1
  resources:
    - resource: allclad-care
      role: maintenance
      order: 1
      note: Manufacturer guidance; select the relevant material/collection.
      review_version: 0.1
    - resource: lodge-care
      role: specialist-reference
      order: 2
      note: Seasoned cast iron only.
      review_version: 0.1
    - resource: tefal-care
      role: maintenance
      order: 3
      note: Coating and product limits, not a ranking.
      review_version: 0.1
