      conversion_eligible: false
- target:
    kind: ingredient
    id: egg
  review_version: 0.1
  hero:
    asset: "references/egg.jpg"
    title: "Egg on white background.jpg"
    source_page: "https://commons.wikimedia.org/wiki/File:Egg_on_white_background.jpg"
    source_file: "https://upload.wikimedia.org/wikipedia/commons/6/67/Egg_on_white_background.jpg"
    creator: "Paolo Neo"
    licence: "Public domain"
    licence_url: "https://commons.wikimedia.org/wiki/Template:PD-author"
    attribution_text: "Egg on white background.jpg — Paolo Neo"
    alt: "A whole brown chicken egg on a white background."
    reviewed_at: "2026-10-11"
    width: 960
    height: 720
    changes: "Resized by Wikimedia Commons; full frame retained."
    caption: "A whole chicken egg."
  editorial:
    - id: summary
      role: summary
      text: Eggs have several culinary functions, including helping form emulsions and incorporating air. Whole egg,
        yolk and white have different roles in a recipe.
      sources:
        - egg-emulsion
        - egg-foam
      review_version: 0.1
    - id: uses
      role: uses
      text: Yolk is useful in emulsified sauces; whites can form foams used in meringues and baking. These examples
        do not imply that every emulsion requires egg or that parts can replace one another without changing a
        recipe.
      sources:
        - egg-emulsion
        - egg-foam
      review_version: 0.1
    - id: parts
      role: context
      text: Yolk and white are the main parts normally separated for cooking. Shell is also part of an egg,
        but is not normally used as a culinary ingredient.
      review_version: 0.1
  resources:
    - resource: egg-emulsion
      role: deeper-explanation
      order: 1
      review_version: 0.1
    - resource: egg-foam
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: emulsify
      note: Yolk contributes to stabilising familiar egg-based sauces.
      sources:
        - egg-emulsion
      review_version: 0.1
    - relation: used-for
      target:
        kind: process
        id: whisk
      note: Whisking can introduce air into whites; it is not synonymous with emulsification.
      sources:
        - egg-foam
      review_version: 0.1
    - relation: used-for
      target:
        kind: process
        id: separate
      note: Separate the yolk and white when the recipe calls for them individually.
      review_version: 0.1
- target:
    kind: process
    id: emulsify
  review_version: 0.1
  hero:
    asset: "references/emulsify.jpg"
    title: "Homemade mayonnaise.jpg"
    source_page: "https://commons.wikimedia.org/wiki/File:Homemade_mayonnaise.jpg"
    source_file: "https://upload.wikimedia.org/wikipedia/commons/7/79/Homemade_mayonnaise.jpg"
    creator: "Jason Terk from Somerville, MA, US"
    licence: "CC BY 2.0"
    licence_url: "https://creativecommons.org/licenses/by/2.0"
    attribution_text: "Homemade mayonnaise.jpg — Jason Terk from Somerville, MA, US"
    alt: "A whisk surrounded by thick, pale yellow homemade mayonnaise."
    reviewed_at: "2026-10-11"
    width: 960
    height: 640
    changes: "Resized by Wikimedia Commons; full frame retained."
    caption: "A whisk and the texture of homemade mayonnaise."
  editorial:
    - id: summary
      role: summary
      text: Emulsifying disperses droplets of one liquid through another liquid with which it does not readily mix.
        The result can be temporary or stabilised.
      sources:
        - aocs-emulsion
      review_version: 0.1
    - id: purpose
      role: purpose
      text: Use emulsification to distribute fat through a sauce or dressing and develop the desired texture.
        Mayonnaise is one example, not the definition of the process.
      sources:
        - cia-mayo
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Mechanical action breaks up droplets. Emulsifying components help resist their joining together again;
        egg yolk supplies such components in familiar sauces.
      sources:
        - exploratorium-emulsion
      review_version: 0.1
    - id: judgement
      role: judgement
      text: For a mayonnaise-like sauce, look for a uniform creamy mixture rather than free oil. Addition rate,
        formulation, tool and temperature matter; there is no universal duration or mixing speed.
      sources:
        - cia-mayo
        - exploratorium-emulsion
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Do not assume more whisking repairs every separated sauce. Overheating an egg sauce may coagulate
        proteins as well as disrupt the emulsion.
      sources:
        - exploratorium-emulsion
      review_version: 0.1
    - id: neighbours
      role: near-neighbours
      text: Mixing and blending may produce emulsions but need not. Whisking can emulsify or aerate; whipping
        commonly concerns foam. These actions do not always produce an emulsion.
      sources:
        - aocs-emulsion
        - egg-foam
      review_version: 0.1
  resources:
    - resource: aocs-emulsion
      role: deeper-explanation
      order: 1
      review_version: 0.1
    - resource: exploratorium-emulsion
      role: introduction
      order: 2
      review_version: 0.1
    - resource: cia-mayo
      role: technique-demonstration
      order: 3
      note: Worked written example; not a universal recipe.
      review_version: 0.1
  associations:
    - relation: contrast-with
      target:
        kind: process
        id: mix
      note: A related action that may serve a different purpose.
      sources:
        - aocs-emulsion
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: whisk
      note: A related action that may serve a different purpose.
      sources:
        - aocs-emulsion
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: blend
      note: A related action that may serve a different purpose.
      sources:
        - aocs-emulsion
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: whip
      note: A related action that may serve a different purpose.
      sources:
        - aocs-emulsion
      review_version: 0.1
    - relation: commonly-used-with
      target:
        kind: ingredient
        id: egg
        parts:
          - yolk
      note: Yolk is useful in some emulsified sauces, not a mandatory ingredient.
      sources:
        - egg-emulsion
      review_version: 0.1
    - relation: commonly-used-with
      target:
        kind: equipment
        id: whisk
      note: One possible tool; method and batch determine suitability.
      sources:
        - cia-mayo
      review_version: 0.1
- target:
    kind: process
    id: sear
  review_version: 0.1
  hero:
    asset: "references/sear.jpg"
    title: "Searing of a Steak.jpg"
    source_page: "https://commons.wikimedia.org/wiki/File:Searing_of_a_Steak.jpg"
    source_file: "https://upload.wikimedia.org/wikipedia/commons/0/05/Searing_of_a_Steak.jpg"
    creator: "Flo2323"
    licence: "CC0"
    licence_url: "https://creativecommons.org/publicdomain/zero/1.0/deed.en"
    attribution_text: "Searing of a Steak.jpg — Flo2323"
    alt: "A browned steak searing over a hot grill with smoke and flame."
    reviewed_at: "2026-10-11"
    width: 960
    height: 640
    changes: "Resized by Wikimedia Commons; full frame retained."
    caption: "One example of searing: a browned steak on a grill."
  editorial:
    - id: summary
      role: summary
      text: Searing develops a browned surface and flavour. It may be one stage of a longer cooking method rather
        than sufficient cooking by itself.
      sources:
        - cia-sear
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Look for the intended browned surface and distinguish useful brown pan deposits from burnt, bitter
        residue. Adjust to the food, cookware and method; no single pan temperature or duration applies.
      sources:
        - cia-sear
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Searing does not seal in juices. A browned exterior is neither a moisture barrier nor proof that the
        interior has reached the desired condition.
      sources:
        - sear-myth
      review_version: 0.1
    - id: neighbours
      role: near-neighbours
      text: Brown describes a wider colour/flavour outcome. Grilling and pan-frying are cooking methods that can
        produce a sear. Caramelisation concerns sugar transformations and should not be used as a blanket
        explanation for every browned surface.
      sources:
        - cia-sear
        - caramelisation
      review_version: 0.1
  resources:
    - resource: cia-sear
      role: technique-demonstration
      order: 1
      note: Written braising example.
      review_version: 0.1
    - resource: sear-myth
      role: deeper-explanation
      order: 2
      review_version: 0.1
  associations:
    - relation: contrast-with
      target:
        kind: process
        id: brown
      note: Related, but not the same cooking method.
      sources:
        - cia-sear
        - caramelisation
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: grill
      note: Related, but not the same cooking method.
      sources:
        - cia-sear
        - caramelisation
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: pan-fry
      note: Related, but not the same cooking method.
      sources:
        - cia-sear
        - caramelisation
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: process
        id: caramelise
      note: Related, but not the same cooking method.
      sources:
        - cia-sear
        - caramelisation
      review_version: 0.1
    - relation: commonly-used-with
      target:
        kind: equipment
        id: frying-pan
      note: A suitable pan is one option; material and product heat limits matter.
      sources:
        - cia-sear
        - tefal-care
      review_version: 0.1
