- target:
    kind: equipment
    id: blender
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A blender uses moving blades to combine or purée ingredients. Countertop jugs, personal containers and
        immersion tools suit different quantities and ways of working.
      sources:
        - kitchenaid-blenders
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose for the food and batch size, not power claims alone. An immersion blender works in a suitable
        vessel; a countertop machine has its own jug and capacity limits.
      sources:
        - kitchenaid-blenders
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Do not assume a sealed personal cup or any ordinary blender is suitable for hot liquid. Check the exact
        model’s temperature, fill and venting instructions before blending soup.
      sources:
        - kitchenaid-use
      review_version: 0.1
    - id: care
      role: care
      text: Disconnect power before handling blades or cleaning parts by hand, and follow the model’s disassembly
        and washing instructions. Dishwasher suitability is not universal.
      sources:
        - kitchenaid-use
        - kitchenaid-clean
      review_version: 0.1
  resources:
    - resource: kitchenaid-blenders
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kitchenaid-use
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: blend
      note: Use a suitable appliance when the recipe calls for mechanical blending.
      sources:
        - kitchenaid-blenders
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: equipment
        id: immersion-blender
      note: A handheld format for working directly in a suitable vessel.
      sources:
        - kitchenaid-blenders
      review_version: 0.1
- target:
    kind: equipment
    id: kitchen-scale
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A kitchen scale measures ingredient mass. It avoids some variation from scooping ingredients into a
        volume measure.
      sources:
        - kab-scale
      review_version: 0.1
    - id: uses
      role: uses
      text: Set a bowl on the platform and tare to zero before adding the ingredient. Taring again lets you weigh
        another addition without counting the bowl or previous ingredients.
      sources:
        - kab-scale
      review_version: 0.1
    - id: selection
      role: selection
      text: Check capacity, readability and performance with small quantities. A display with fine increments does
        not by itself guarantee reliable measurement of a tiny pinch.
      sources:
        - kab-scale
      review_version: 0.1
    - id: context
      role: context
      text: Keep weighing separate from volume conversion. A gram reading does not tell you the volume of an
        ingredient unless suitable ingredient-specific evidence is available.
      sources:
        - kab-scale
      review_version: 0.1
  resources:
    - resource: kab-scale
      role: introduction
      order: 1
      review_version: 0.1
  hero:
    asset: references/kitchen-scale.jpg
    title: 2023 Elektroniczna waga kuchenna.jpg
    source_page: https://commons.wikimedia.org/wiki/File:2023_Elektroniczna_waga_kuchenna.jpg
