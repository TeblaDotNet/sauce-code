- target:
    kind: equipment
    id: measuring-spoon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A measuring spoon supplies a labelled volume for small quantities. Read the marking rather than treating
        an eating spoon as a measured teaspoon.
      sources:
        - oxo-spoons
      review_version: 0.1
    - id: context
      role: context
      text: Use the recipe’s stated measuring method, including whether the spoonful is level or heaped. Check the
        marked units; a spoon measure is not an ingredient weight.
      sources:
        - oxo-spoons
        - kab-success
      review_version: 0.1
  resources:
    - resource: oxo-spoons
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-success
      role: specialist-reference
      order: 2
      review_version: 0.1
