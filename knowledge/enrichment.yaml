- target:
    kind: ingredient
    id: brown-sugar
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Brown sugar adds sweetness and a molasses-associated flavour. This measurement example concerns soft
        light or dark brown sugar, not every product sold under a brown-sugar name.
      sources:
        - domino-faq
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Light soft brown sugar offers a gentler molasses character; a dark style gives a stronger flavour.
        Choose according to the intended recipe rather than treating colour as an identity rule.
      sources:
        - domino-faq
      review_version: 0.1
    - id: uses
      role: uses
      text: Soft brown sugars are used in baking, glazes and sweet-savoury sauces. Product and recipe differences
        matter when considering alternatives.
      sources:
        - domino-faq
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep brown sugar tightly covered in a cool place. Moisture loss can harden it; hard lumps are not a
        reproducible packed measure.
      sources:
        - domino-storage
      review_version: 0.1
    - id: scope
      role: context
      text: UK product ranges distinguish light and dark soft brown sugar from muscovado and demerara. These names
        are not automatically exact aliases or interchangeable measurements.
      sources:
        - billingtons-range
      review_version: 0.1
    - id: packing
      role: context
      text: For a packed measure, spoon sugar into the vessel, press down, repeat to fill, and level the top.
        Packing is a measuring method, not a new ingredient or preparation identity; an authored gram amount
        needs no packing conversion.
      sources:
        - ch-pack
      review_version: 0.1
  resources:
    - resource: kab-weight
      role: measurement-reference
      order: 1
      review_version: 0.1
    - resource: ch-pack
      role: technique-demonstration
      order: 2
      note: Written method checked; linked video playback and duration not verified.
      review_version: 0.1
    - resource: billingtons-range
      role: specialist-reference
      order: 3
      note: UK terminology comparison, not a buying recommendation.
      review_version: 0.1
  measurements:
    - id: packed-kab
      target:
        kind: ingredient
        id: brown-sugar
      product_scope: Soft light/dark brown sugar represented by the source chart
      condition: packed
      original: 213 g per 1 cup, brown sugar (dark or light, packed).
      source: kab-weight
      locator: Brown sugar (dark or light, packed) row
      accessed: 2026-10-11
      unit: g/mL
