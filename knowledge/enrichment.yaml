- target:
    kind: equipment
    id: knife
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Kitchen knives cut and prepare food. A larger chef knife and small paring knife offer different ways to
        approach a task.
      sources:
        - cia-knives
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose a blade and grip that suit the food and the person using it. A comfortable, controlled tool
        matters more than having a large collection.
      sources:
        - cia-knives
      review_version: 0.1
    - id: uses
      role: uses
      text: Slicing, chopping and dicing call for control of the food and blade. Keep the work surface stable and
        learn the grip and cutting motion before concentrating on speed.
      sources:
        - cia-knives
      review_version: 0.1
    - id: context
      role: context
      text: Honing and sharpening are different maintenance tasks. Do not apply one sharpening angle or tool to
        every blade; use guidance appropriate to its construction.
      sources:
        - cia-knives
        - wusthof-care
      review_version: 0.1
    - id: care
      role: care
      text: Wash and dry carefully, then store with the edge protected. WUSTHOF’s care guidance is for its knives;
        consult the maker of your own knife for material-specific instructions.
      sources:
        - wusthof-care
      review_version: 0.1
  resources:
    - resource: cia-knives
      role: introduction
      order: 1
      review_version: 0.1
    - resource: wusthof-care
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: slice
      note: Select a suitable blade for the food.
      sources:
        - cia-knives
      review_version: 0.1
    - relation: used-for
      target:
        kind: process
        id: dice
      note: A controlled cut rather than a required knife brand.
      sources:
        - rouxbe-dice
      review_version: 0.1
- target:
    kind: equipment
    id: pressure-cooker
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A pressure cooker holds steam under pressure to cook food. It needs cooking liquid and a properly
        functioning lid, seal and pressure-control system.
      sources:
        - presto-faq
        - presto-use
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The cooking environment differs from an open saucepan. Establish and maintain pressure as the appliance
        instructions require; the time to reach pressure is distinct from the timed cooking stage.
      sources:
        - presto-use
      review_version: 0.1
    - id: selection
      role: selection
      text: Stovetop and electric models have different controls and operating procedures. Choose a size suited to
        the batch and follow that model’s minimum-liquid and maximum-fill instructions, including special
        limits for expanding foods.
      sources:
        - presto-faq
        - presto-manual
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use the pressure indicator and release procedure specified for the appliance and recipe. Never force
        open a pressurised cooker. Quick release and natural cooling are not interchangeable for every food.
      sources:
        - presto-use
        - presto-manual
      review_version: 0.1
    - id: care
      role: care
      text: Check and maintain the seal, vent and safety devices according to the manual. A blocked vent or damaged
        component is a reason to stop using the cooker until the problem is corrected.
      sources:
        - presto-use
        - presto-manual
      review_version: 0.1
    - id: context
      role: context
      text: "Pressure cooking a meal is not the same as pressure canning. USDA/NCHFP canning schedules are not
        designed for small pressure cookers: vessel size and heating and cooling behaviour affect the
        process."
      sources:
        - nchfp-pressure
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Do not use an ordinary pressure-cooking programme as proof that sealed jars are safe for shelf storage.
        Use suitable canning equipment and a validated preservation procedure for that separate task.
      sources:
        - nchfp-pressure
      review_version: 0.1
  resources:
    - resource: presto-use
      role: introduction
      order: 1
      review_version: 0.1
    - resource: presto-faq
      role: specialist-reference
      order: 2
      review_version: 0.1
    - resource: nchfp-pressure
      role: specialist-reference
      order: 3
      review_version: 0.1
    - resource: presto-manual
      role: maintenance
      order: 4
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: pressure-cook
      note: Use the appliance’s own operating and release instructions.
      sources:
        - presto-use
      review_version: 0.1
- target:
    kind: ingredient
    id: water
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Water is the clear liquid used to hydrate ingredients and dissolve substances such as salt and sugar. In
        breadmaking, it brings flour into a dough and supports fermentation.
      sources:
        - kab-water
      review_version: 0.1
    - id: judgement
      role: judgement
      text: The amount and temperature of water affect dough consistency and fermentation. Ordinary drinking water
        is generally suitable; use the recipe’s specified amount before adjusting for the feel of the dough.
      sources:
        - kab-water
      review_version: 0.1
  resources:
    - resource: kab-water
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: onion
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An onion is an edible bulb formed from the swollen leaf bases of an allium plant. It is used fresh or
        cooked as a vegetable and flavouring.
      sources:
        - usu-onion
      review_version: 0.1
    - id: storage
      role: storage
      text: Mature storage onions need dry, well-ventilated conditions. Green onions are harvested before a mature
        bulb develops and should be treated as fresh produce rather than stored like cured bulbs.
      sources:
        - usu-onion
      review_version: 0.1
  resources:
    - resource: usu-onion
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: potato
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A potato is the edible underground tuber of the potato plant. It is cooked by boiling, baking, roasting
        or mashing.
      sources:
        - purdue-potato
      review_version: 0.1
    - id: selection
      role: selection
      text: "Choose the type for the dish: floury baking potatoes and tender-skinned new potatoes give different
        results. Keep stored potatoes away from light, and check tenderness rather than relying on one cooking
        time for every size."
      sources:
        - purdue-potato
      review_version: 0.1
  resources:
    - resource: purdue-potato
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: carrot
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A carrot is an edible root vegetable, commonly orange but also grown in other colours. It is eaten raw
        or cooked in soups, stir-fries and other dishes.
      sources:
        - usu-carrots
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose firm roots. Remove leafy tops before refrigerating; wash and trim the carrots before use. Peeling
        is a preparation choice rather than a requirement for every dish.
      sources:
        - usu-carrots
      review_version: 0.1
  resources:
    - resource: usu-carrots
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: garlic
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Garlic is an allium bulb divided into individual cloves. The cloves are used whole, sliced, minced or
        crushed to flavour cooking.
      sources:
        - purdue-garlic
      review_version: 0.1
    - id: storage
      role: storage
      text: Choose firm bulbs with dry outer skins. Keep uncut bulbs in a cool, dry, dark place; separate the cloves
        and remove their papery skins when preparing them.
      sources:
        - purdue-garlic
      review_version: 0.1
  resources:
    - resource: purdue-garlic
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: lemon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A lemon is a citrus fruit with acidic juice and an aromatic outer peel. Its juice and zest flavour
        dressings, fish dishes, baking and desserts.
      sources:
        - usu-lemons
      review_version: 0.1
    - id: uses
      role: uses
      text: For zest, wash the fruit and remove the coloured outer layer, avoiding the bitter white pith beneath.
        Zest and juice contribute different qualities; a recipe may call for either or both.
      sources:
        - usu-lemons
      review_version: 0.1
  resources:
    - resource: usu-lemons
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: apple
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An apple is a firm-fleshed fruit with a central seed core. It is eaten raw and cooked into baked dishes,
        sauces and preserves.
      sources:
        - purdue-apple
      review_version: 0.1
    - id: uses
      role: uses
      text: Whole baked apples, slices and applesauce call for different preparation. Remove the core for baking and
        check that the flesh has softened to the texture wanted.
      sources:
        - purdue-apple
      review_version: 0.1
  resources:
    - resource: purdue-apple
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: banana
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A banana is a soft-fleshed fruit enclosed in a peel. It is eaten fresh or mashed into pancakes, muffins
        and other baking.
      sources:
        - usu-bananas
      review_version: 0.1
    - id: storage
      role: storage
      text: Ripen bananas at room temperature. Once ripe, refrigeration slows further ripening; the peel may darken
        even while the flesh remains usable.
      sources:
        - usu-bananas
      review_version: 0.1
  resources:
    - resource: usu-bananas
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: broccoli
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Broccoli is a vegetable eaten for its clustered flower buds and stems. It is served raw or cooked,
        including steamed and roasted preparations.
      sources:
        - purdue-broccoli
      review_version: 0.1
    - id: uses
      role: uses
      text: Both florets and stems are useful. Trim the woody end and peel a thick stem before cutting it into
        pieces; choose firm heads without yellowing florets.
      sources:
        - purdue-broccoli
      review_version: 0.1
  resources:
    - resource: purdue-broccoli
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: spinach
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Spinach is a leafy green vegetable with tender edible leaves. It is eaten in salads or wilted into
        soups, pasta and other cooked dishes.
      sources:
        - purdue-spinach
      review_version: 0.1
    - id: uses
      role: uses
      text: Wash away grit and remove tough stems. Cooked spinach can release considerable water; drain or squeeze
        it when the recipe needs a drier filling.
      sources:
        - purdue-spinach
      review_version: 0.1
  resources:
    - resource: purdue-spinach
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: aubergine
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Aubergine is the fleshy fruit also known as eggplant or brinjal. It is commonly fried, grilled, roasted
        or cooked until soft for purées.
      sources:
        - purdue-eggplant
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Its flesh absorbs oil readily. When sautéing, avoid repeatedly adding oil simply because the pan looks
        dry; judge the softening flesh as well. Salting is useful in some preparations but unnecessary in
        others.
      sources:
        - purdue-eggplant
      review_version: 0.1
  resources:
    - resource: purdue-eggplant
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: courgette
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Courgette, also called zucchini, is a summer squash usually harvested young. It is eaten raw or cooked,
        and can be grated into baking.
      sources:
        - usu-zucchini
      review_version: 0.1
    - id: selection
      role: selection
      text: Small, firm courgettes have tender skins that can be left on. Larger ones may have tougher flesh and
        developed seeds; scoop out a coarse seed centre before grating for a cake or loaf.
      sources:
        - usu-zucchini
      review_version: 0.1
  resources:
    - resource: usu-zucchini
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: ginger
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Ginger is the aromatic rhizome, or underground stem, of the ginger plant. It flavours savoury dishes,
        baking, confectionery and drinks.
      sources:
        - kew-ginger
      review_version: 0.1
    - id: context
      role: context
      text: Fresh ginger, dried powder and ginger preserved in sugar are distinct cooking forms. Preserved stem
        ginger contributes sugar as well as ginger flavour; it is not simply fresh ginger in a different
        shape.
      sources:
        - kew-ginger
      review_version: 0.1
  resources:
    - resource: kew-ginger
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: black-pepper
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Black pepper is a spice made from the fruits of Piper nigrum. It adds pungency to savoury food and is
        used as a table seasoning.
      sources:
        - kew-pepper
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Black, white and green peppercorns come from the same plant but differ in harvesting and processing.
        Chilli peppers and Sichuan pepper come from different plants.
      sources:
        - kew-pepper
      review_version: 0.1
  resources:
    - resource: kew-pepper
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: basil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Basil is an aromatic culinary herb, with sweet basil among the most familiar types. Its leaves flavour
        salads and cooked dishes, including stir-fries.
      sources:
        - kew-basil
      review_version: 0.1
    - id: sensory
      role: sensory
      text: "Basil types differ noticeably: Thai basil has an anise character, while other cultivars suggest lemon
        or cinnamon. Choose the type named in a recipe when that flavour matters."
      sources:
        - kew-basil
      review_version: 0.1
  resources:
    - resource: kew-basil
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: wheat-flour
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Wheat flour is grain from wheat milled into a powder, with differing amounts of bran and germ retained.
        It is used in breads, cakes, pastry and other baking.
      sources:
        - kab-flours
      review_version: 0.1
    - id: selection
      role: selection
      text: Bread flour generally has greater gluten-forming potential than cake flour. All-purpose flour lies
        between them; exact specifications vary by producer, so a product’s stated protein level can be more
        informative than its name alone.
      sources:
        - kab-flours
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Whole-wheat flour includes the grain’s outer layers and behaves differently from white flour.
        Self-rising flour also contains leavening and salt; it is not plain flour with a different milling
        grade.
      sources:
        - kab-flours
      review_version: 0.1
  resources:
    - resource: kab-flours
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: rice
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Rice is a cereal grain sold with differing degrees of milling. It is cooked as a staple, side dish or
        ingredient in mixed dishes.
      sources:
        - wholegrains-az
      review_version: 0.1
    - id: selection
      role: selection
      text: Brown rice retains the bran and germ; white rice has those layers removed. The distinction affects
        cooking behaviour as well as flavour.
      sources:
        - wholegrains-az
      review_version: 0.1
    - id: context
      role: context
      text: Choose the rice specified by the dish rather than treating all varieties as one interchangeable grain.
        Whole-grain and milled forms need different cooking schedules.
      sources:
        - wholegrains-az
      review_version: 0.1
  resources:
    - resource: wholegrains-az
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: oats
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Oats are cereal grains commonly sold as whole groats, cut pieces or rolled flakes. They are used in
        porridge and baking.
      sources:
        - wholegrains-az
      review_version: 0.1
    - id: selection
      role: selection
      text: Steel-cut oats are chopped groats; rolled oats have been steamed and flattened. Quick-cooking flakes are
        processed for faster preparation.
      sources:
        - wholegrains-az
      review_version: 0.1
    - id: judgement
      role: judgement
      text: The form affects cooking time and texture. A recipe relying on distinct rolled flakes will behave
        differently with whole groats or finely processed oats.
      sources:
        - wholegrains-az
      review_version: 0.1
  resources:
    - resource: wholegrains-az
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: lentils
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Lentils are small edible seeds of a legume, sold whole or split. They are cooked in soups, curries,
        salads and purées.
      sources:
        - lentils-about
      review_version: 0.1
    - id: selection
      role: selection
      text: Split lentils have had their seed coat removed and the inner seed divided. They soften faster and break
        down more readily than whole lentils.
      sources:
        - lentils-about
      review_version: 0.1
    - id: uses
      role: uses
      text: Choose whole lentils when separate pieces are useful in a salad; choose split lentils when a thick, soft
        texture is wanted in a soup or curry.
      sources:
        - lentils-about
      review_version: 0.1
  resources:
    - resource: lentils-about
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: milk
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Dairy milk is the liquid produced by mammals, with cow’s milk a common culinary form. It is used in
        drinks, sauces, desserts and baking.
      sources:
        - dairy-milk
      review_version: 0.1
    - id: selection
      role: selection
      text: "Whole, reduced-fat and skimmed milk differ in richness. Processing also differs: pasteurised and
        long-life milk have different unopened storage requirements."
      sources:
        - dairy-milk
      review_version: 0.1
    - id: storage
      role: storage
      text: Follow the pack’s storage instructions, including refrigeration after opening. An unopened long-life
        carton and an opened one should not be treated alike.
      sources:
        - dairy-milk
      review_version: 0.1
  resources:
    - resource: dairy-milk
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: cream
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cream is the milk-fat-rich portion of dairy milk. It enriches sauces and desserts and, in suitable
        forms, can be whipped.
      sources:
        - dairy-cream
      review_version: 0.1
    - id: selection
      role: selection
      text: Pouring, whipping, thickened and double creams are not identical products. Fat level, added thickeners
        and processing affect their behaviour; names also vary between markets.
      sources:
        - dairy-cream
      review_version: 0.1
    - id: judgement
      role: judgement
      text: For whipped toppings, choose a product labelled suitable for whipping. For sauces, use the type the
        recipe expects rather than assuming every cream will thicken or tolerate heating in the same way.
      sources:
        - dairy-cream
      review_version: 0.1
  resources:
    - resource: dairy-cream
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: yoghurt
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Yoghurt is milk fermented with a yoghurt starter culture. It is eaten on its own and used in drinks,
        sauces and other preparations.
      sources:
        - tetrapak-yoghurt
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The culture produces acid, encouraging milk proteins to form a soft gel. Production and subsequent
        stirring or straining help determine the final texture.
      sources:
        - tetrapak-yoghurt
      review_version: 0.1
    - id: selection
      role: selection
      text: Set, stirred, drinking and concentrated yoghurts differ in consistency. Sweetened or flavoured products
        also bring ingredients that plain yoghurt does not.
      sources:
        - tetrapak-yoghurt
      review_version: 0.1
  resources:
    - resource: tetrapak-yoghurt
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: parmesan-cheese
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Parmesan is a hard, matured cheese with a dry, granular texture. It is commonly grated or shaved over
        food.
      sources:
        - dairy-hard-cheese
      review_version: 0.1
    - id: context
      role: context
      text: Parmigiano Reggiano is a specific regional cheese; products called parmesan in other markets may be made
        elsewhere. Read the product name and origin when that distinction matters to a dish.
      sources:
        - dairy-hard-cheese
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep the cheese covered in the refrigerator. A piece can be grated finely or shaved into broader flakes
        according to the texture wanted.
      sources:
        - dairy-hard-cheese
      review_version: 0.1
  resources:
    - resource: dairy-hard-cheese
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: coconut-milk
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Coconut milk is an emulsion extracted from the flesh of mature coconuts, often with added water. It
        contributes coconut flavour and a creamy texture to cooking.
      sources:
        - tetrapak-coconut
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Grated coconut flesh is pressed and strained. Adding more water produces a more dilute extract; standing
        can separate an oil-rich upper layer from the watery portion.
      sources:
        - tetrapak-coconut
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Coconut cream is richer than coconut milk, while coconut water is the liquid collected from inside the
        nut. These names describe different products rather than interchangeable labels.
      sources:
        - tetrapak-coconut
      review_version: 0.1
  resources:
    - resource: tetrapak-coconut
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: tofu
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tofu is a food made by coagulating soy milk. It is cooked in pieces or blended into sauces, soups and
        desserts.
      sources:
        - illinois-tofu
      review_version: 0.1
    - id: selection
      role: selection
      text: Regular tofu is sold in several firmnesses. Firm blocks are useful when pieces should hold their shape;
        softer forms can be crumbled or mashed.
      sources:
        - illinois-tofu
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Silken tofu has a smooth, delicate texture and needs gentle handling. It suits blending, but does not
        behave like a firm pressed block when tossed in a pan.
      sources:
        - illinois-tofu
      review_version: 0.1
  resources:
    - resource: illinois-tofu
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: baking-soda
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Baking soda is sodium bicarbonate, an alkaline chemical leavener. It helps batters and doughs rise when
        balanced with acidic ingredients.
      sources:
        - kab-leaveners
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Acid and moisture allow it to release carbon dioxide. That reaction begins during mixing, so the timing
        of the recipe matters.
      sources:
        - kab-leaveners
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Baking powder contains its own acid components as well as a base. It is not a direct spoon-for-spoon
        replacement for baking soda.
      sources:
        - kab-leaveners
      review_version: 0.1
  resources:
    - resource: kab-leaveners
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: vinegar
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Vinegar is an acidic liquid used as a culinary ingredient. It adds sourness to food and supplies acid in
        many pickling recipes.
      sources:
        - nchfp-pickle
      review_version: 0.1
    - id: selection
      role: selection
      text: For pickling, the stated acidity matters as much as flavour. Use the type and strength specified by a
        tested recipe.
      sources:
        - nchfp-pickle
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Do not change vinegar, water or food proportions in a preservation recipe, or use vinegar of unknown
        acidity. A pleasant sour taste alone does not establish a safe preserved product.
      sources:
        - nchfp-pickle
      review_version: 0.1
  resources:
    - resource: nchfp-pickle
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: honey
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Honey is a sweet substance made and stored by bees. It sweetens drinks, desserts and savoury
        preparations.
      sources:
        - honey-making
        - honey-cooking
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Honey contributes flavour as well as sweetness, making its character relevant to sauces and dressings.
      sources:
        - honey-cooking
      review_version: 0.1
    - id: context
      role: context
      text: Crystallisation can occur naturally as glucose leaves the liquid phase. Different honeys crystallise at
        different rates; crystals are not, by themselves, evidence of adulteration.
      sources:
        - honey-crystals
      review_version: 0.1
  resources:
    - resource: honey-making
      role: introduction
      order: 1
      review_version: 0.1
    - resource: honey-crystals
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: honey-cooking
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: ingredient
    id: beef
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Beef is meat from cattle, sold in cuts with differing muscle structure and fat. It is cooked as steaks,
        roasts, braises, stews and minced-meat dishes.
      sources:
        - beef-cuts
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose a cut for the cooking method. A tender loin steak and a working-muscle cut such as shin need
        different treatment, even though both are beef.
      sources:
        - meat-structure
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Hard-working muscles contain more connective tissue. Slow cooking methods can soften that structure;
        naturally tender cuts do not need the same prolonged treatment.
      sources:
        - meat-structure
      review_version: 0.1
    - id: uses
      role: uses
      text: Stewing and braising suit many tougher cuts. Quick pan-frying or grilling suits tender steaks, with
        thickness affecting how the centre cooks.
      sources:
        - meat-structure
      review_version: 0.1
    - id: context
      role: context
      text: Butchery names depend on the market and how the carcass is divided. The linked US cut collections are a
        guide to specific examples; ask for the corresponding local cut rather than relying on a
        familiar-sounding name.
      sources:
        - beef-cuts
      review_version: 0.1
  resources:
    - resource: meat-structure
      role: introduction
      order: 1
      review_version: 0.1
    - resource: beef-cuts
      role: deeper-explanation
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: stew
      note: A suitable working-muscle cut can soften during slow, moist cooking.
      sources:
        - meat-structure
      review_version: 0.1
- target:
    kind: ingredient
    id: salmon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Salmon is a group of fish sold as whole fish, fillets and processed products. It is roasted, grilled,
        poached, steamed or used in other dishes.
      sources:
        - alaska-species
        - alaska-salmon
      review_version: 0.1
    - id: selection
      role: selection
      text: Species differ in richness, colour and texture. Alaska’s king, sockeye, coho, keta and pink salmon
        illustrate that range rather than defining every salmon sold worldwide.
      sources:
        - alaska-salmon
      review_version: 0.1
    - id: uses
      role: uses
      text: A fillet can be portioned for pan cooking or kept larger for oven cooking. Thickness changes cooking
        time, so similarly sized portions are easier to finish together.
      sources:
        - alaska-salmon
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Fish becomes more opaque and separates into flakes as it cooks. Those cues help judge texture, but a
        cooking schedule still needs to suit the actual portion.
      sources:
        - alaska-salmon
      review_version: 0.1
    - id: context
      role: context
      text: Fresh, frozen, canned and smoked products need different preparation. The linked cooking guide
        distinguishes frozen from thawed portions; do not transfer one schedule automatically to the other.
      sources:
        - alaska-salmon
        - alaska-species
      review_version: 0.1
  resources:
    - resource: alaska-salmon
      role: introduction
      order: 1
      review_version: 0.1
    - resource: alaska-species
      role: deeper-explanation
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: poach
      note: Gentle cooking in liquid is one preparation for salmon portions.
      sources:
        - alaska-salmon
      review_version: 0.1
- target:
    kind: ingredient
    id: soy-sauce
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Soy sauce is a liquid seasoning made from soy-based raw materials through processes that vary by
        tradition and product. It seasons food during cooking and at the table.
      sources:
        - kikkoman-brew
        - kikkoman-sauce-types
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: In Kikkoman’s naturally brewed process, soybeans, wheat, salt and water undergo staged cultivation,
        fermentation and maturation before pressing. This describes that producer’s method, not every soy
        sauce.
      sources:
        - kikkoman-brew
      review_version: 0.1
    - id: context
      role: context
      text: Japanese styles include koikuchi, the common type; paler usukuchi; tamari; twice-brewed saishikomi; and
        very pale shiro. These names describe distinct styles rather than a single sauce at different
        strengths.
      sources:
        - kikkoman-sauce-types
      review_version: 0.1
    - id: selection
      role: selection
      text: Style and production method are separate distinctions. Japanese labels can distinguish traditional
        brewing from methods that incorporate hydrolysed vegetable protein; choose the style specified by the
        dish.
      sources:
        - kikkoman-sauce-types
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Wheat is used in the cited brewing process. Do not infer the ingredients of a particular bottle from the
        generic name; check its label.
      sources:
        - kikkoman-brew
      review_version: 0.1
  resources:
    - resource: kikkoman-brew
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kikkoman-sauce-types
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: miso
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Miso is a fermented seasoning made with soybeans, salt and koji, with rice or barley used in many types.
        It flavours soups, sauces and other dishes.
      sources:
        - sendai-miso
      review_version: 0.1
    - id: selection
      role: selection
      text: Rice, barley and soybean misos form broad groups. The proportion of koji and the production process
        affect the resulting character.
      sources:
        - sendai-miso
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Colour and sweetness vary between styles. White and red are useful descriptions, but do not replace the
        product’s fuller identity or a taste of the actual miso.
      sources:
        - sendai-miso
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Plain miso paste and prepared soup products differ. Some commercial products include stock ingredients,
        so they bring more than fermented paste alone.
      sources:
        - marukome-miso
      review_version: 0.1
  resources:
    - resource: sendai-miso
      role: introduction
      order: 1
      review_version: 0.1
    - resource: marukome-miso
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: yeast
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Baker’s yeast is a living microorganism used as a leavener. It ferments bread dough to produce gas and
        contribute flavour.
      sources:
        - kab-yeast-guide
        - kab-yeast
        - kab-leavener-freshness
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Fermentation produces carbon dioxide, which expands within the dough. Time and temperature affect how
        quickly that happens.
      sources:
        - kab-yeast
      review_version: 0.1
    - id: selection
      role: selection
      text: Instant, active dry and fresh yeast are different commercial forms. Follow the recipe and product
        directions for incorporation rather than assuming they all need the same preliminary treatment.
      sources:
        - kab-yeast-guide
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Judge dough by its development and the recipe’s readiness cues, not elapsed time alone. A cooler dough
        usually needs longer than a warmer one.
      sources:
        - kab-yeast-guide
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Chemical leaveners release gas through chemical reactions; baker’s yeast relies on fermentation.
        Swapping between them requires a different recipe method.
      sources:
        - kab-yeast
        - kab-leavener-freshness
      review_version: 0.1
  resources:
    - resource: kab-yeast-guide
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-yeast
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: kab-leavener-freshness
      role: deeper-explanation
      order: 3
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: prove
      note: Yeast activity contributes to the expansion of bread dough.
      sources:
        - kab-yeast-guide
      review_version: 0.1
- target:
    kind: ingredient
    id: baking-powder
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Baking powder is a chemical leavener containing an alkaline component and acid components. It raises
        cakes, quick breads and other baking without yeast fermentation.
      sources:
        - kab-leaveners
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Moisture starts gas production; double-acting formulations release additional gas as they heat. A starch
        component helps keep the dry ingredients separated.
      sources:
        - kab-leavener-freshness
      review_version: 0.1
    - id: selection
      role: selection
      text: Use the quantity and type called for by the recipe. Different leaveners change more than the amount of
        rise, including the balance of acidity in a batter.
      sources:
        - kab-leaveners
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Old baking powder can lose effectiveness. The linked freshness guide describes a small hot-water test;
        check before relying on a long-opened container for a cake.
      sources:
        - kab-leavener-freshness
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Baking soda needs an acid supplied elsewhere in the recipe. Baking powder already includes acid, so
        exchanging the two by equal volume is unreliable.
      sources:
        - kab-leaveners
      review_version: 0.1
  resources:
    - resource: kab-leaveners
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-leavener-freshness
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: cocoa-powder
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cocoa powder is finely ground cocoa material with much of its cocoa butter removed. It flavours baking,
        drinks, sauces and desserts.
      sources:
        - kab-cocoa-compare
      review_version: 0.1
    - id: selection
      role: selection
      text: Natural cocoa retains acidity; Dutch-process cocoa is treated with an alkaline agent. The treatment
        changes colour and flavour as well as acidity.
      sources:
        - kab-cocoa-types
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Cocoa choice can interact with a recipe’s chemical leaveners. A recipe relying on natural cocoa’s
        acidity may not behave the same way with an alkalised powder.
      sources:
        - kab-cocoa-compare
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Darker powder is not simply a stronger version of the same flavour. Strongly alkalised black cocoa has a
        distinct character from natural or ordinary Dutch-process cocoa.
      sources:
        - kab-cocoa-types
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Follow the specified cocoa in chemically leavened baking. In a sauce or drink without those leaveners,
        flavour and colour give more room for choice.
      sources:
        - kab-cocoa-types
      review_version: 0.1
  resources:
    - resource: kab-cocoa-types
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-cocoa-compare
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: mince
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Mincing is cutting food into very small pieces.
      sources:
        - cia-prep
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It distributes ingredients such as herbs or onion through a mixture without leaving large pieces.
        Continue cutting to the fineness the recipe needs.
      sources:
        - cia-prep
      review_version: 0.1
  resources:
    - resource: cia-prep
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: julienne
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Julienne is cutting food into thin, fairly even strips.
      sources:
        - cia-prep
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Cut flat slices first, then cut those into narrow strips. Consistent thickness matters more for even
        cooking than producing a few perfect pieces among uneven ones.
      sources:
        - cia-prep
      review_version: 0.1
  resources:
    - resource: cia-prep
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: grate
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Grating is rubbing food against a cutting surface to produce small shreds or particles.
      sources:
        - oxo-graters
      review_version: 0.1
    - id: purpose
      role: purpose
      text: Coarse surfaces make larger shreds of cheese or vegetables; fine surfaces produce smaller particles.
        Select the surface for the texture needed in the dish.
      sources:
        - oxo-graters
      review_version: 0.1
  resources:
    - resource: oxo-graters
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: commonly-used-with
      target:
        kind: equipment
        id: grater
      note: The cutting surface determines the size of the grated pieces.
      sources:
        - oxo-graters
      review_version: 0.1
- target:
    kind: process
    id: peel
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Peeling is removing the outer skin or covering of an ingredient.
      sources:
        - cia-prep
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Use a peeler or suitable knife to remove the layer required. For onions, remove the papery covering
        while retaining as much usable flesh as practical.
      sources:
        - cia-prep
      review_version: 0.1
  resources:
    - resource: cia-prep
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: zest
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Zesting is removing the coloured outer layer of a citrus peel.
      sources:
        - usu-lemons
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It supplies aromatic peel without much of the bitter white pith underneath. Wash the fruit first and
        stop grating once the pale layer is exposed.
      sources:
        - usu-lemons
      review_version: 0.1
  resources:
    - resource: usu-lemons
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: mash
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Mashing is breaking soft food down by pressing or crushing it.
      sources:
        - purdue-potato
        - oxo-masher
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Cook potatoes until tender before pressing them with a masher. Continue only to the texture required,
        whether pieces remain or the mixture is smoother.
      sources:
        - purdue-potato
        - oxo-masher
      review_version: 0.1
  resources:
    - resource: purdue-potato
      role: introduction
      order: 1
      review_version: 0.1
    - resource: oxo-masher
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: crush
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Crushing is breaking an ingredient by applying pressure.
      sources:
        - lc-mortar
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It can open spices or break herbs into a rough mixture. A mortar and pestle lets you work from coarse
        fragments towards a finer paste without requiring uniform knife cuts.
      sources:
        - lc-mortar
      review_version: 0.1
  resources:
    - resource: lc-mortar
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: strain
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Straining is passing a mixture through a perforated or mesh barrier to separate liquid from larger
        solids.
      sources:
        - cia-stock
      review_version: 0.1
    - id: uses
      role: uses
      text: For stock, strain the cooked liquid away from the bones and vegetables. Choose a finer barrier when
        smaller particles need to be held back.
      sources:
        - cia-stock
      review_version: 0.1
  resources:
    - resource: cia-stock
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: skim
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Skimming is lifting unwanted material from the surface of a liquid.
      sources:
        - cia-stock
      review_version: 0.1
    - id: purpose
      role: purpose
      text: In stock-making it removes surface foam or fat while retaining the liquid beneath. Work at the surface
        rather than stirring the material back through the stock.
      sources:
        - cia-stock
      review_version: 0.1
  resources:
    - resource: cia-stock
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: fold
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Folding is gently combining mixtures by lifting and turning them together.
      sources:
        - kab-cake-mixing
      review_version: 0.1
    - id: purpose
      role: purpose
      text: In foam cakes it incorporates ingredients while preserving as much trapped air as possible. Stop once
        evenly combined instead of continuing to beat the mixture.
      sources:
        - kab-cake-mixing
      review_version: 0.1
  resources:
    - resource: kab-cake-mixing
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: boil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Boiling is heating a liquid until bubbles form throughout it and break vigorously at the surface.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It provides active moist heat for ingredients that can tolerate movement in the liquid.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A rolling boil is more turbulent than a simmer. Delicate food may need gentler cooking even after the
        liquid has first been brought to the boil.
      sources:
        - cia-moist-heat
      review_version: 0.1
  resources:
    - resource: cia-moist-heat
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: simmer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Simmering is cooking in liquid held below a full boil, with gentle bubbling.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It cooks food with less agitation than boiling, useful for stocks and slow-cooked dishes.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Watch the liquid, not just the hob setting. Reduce the heat if the pan develops a vigorous rolling boil.
      sources:
        - cia-moist-heat
      review_version: 0.1
  resources:
    - resource: cia-moist-heat
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: poach
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Poaching is cooking food gently in liquid below a full simmer.
      sources:
        - cia-poaching
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The food may be partly or fully submerged. Keep the liquid gentle and use a pan that holds the portions
        without crowding.
      sources:
        - cia-poaching
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Fish and other delicate portions can break up under vigorous bubbling. Monitor the liquid and the food
        separately; the right liquid temperature does not alone establish that the centre is cooked.
      sources:
        - cia-poaching
      review_version: 0.1
  resources:
    - resource: cia-poaching
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: steam
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Steaming is cooking food with steam rather than immersing it in the cooking water.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Hold the food above the liquid and cover the vessel so steam surrounds it.
      sources:
        - cia-moist-heat
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Check the water supply during longer cooking so the vessel does not boil dry. The food’s size and
        arrangement affect how evenly it cooks.
      sources:
        - cia-moist-heat
      review_version: 0.1
  resources:
    - resource: cia-moist-heat
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: stew
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Stewing is slow cooking of food in liquid, commonly with small pieces largely submerged.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It softens suitable ingredients while producing a cooking liquid served with them.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Keep the covered pan at a gentle simmer and judge tenderness before finishing the sauce.
      sources:
        - cia-techniques
      review_version: 0.1
  resources:
    - resource: cia-techniques
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: bake
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Baking is cooking food in an oven’s enclosed heat.
      sources:
        - kab-success
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It sets the structure of batters and doughs and can dry or brown their surfaces.
      sources:
        - kab-success
      review_version: 0.1
    - id: judgement
      role: judgement
      text: "Preheat as directed and use the specified pan size. Timing is a guide: combine the recipe’s colour,
        texture and doneness cues rather than assuming every oven finishes identically."
      sources:
        - kab-success
      review_version: 0.1
  resources:
    - resource: kab-success
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: saute
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sautéing is cooking food fairly quickly in a small amount of fat over relatively high heat.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It cooks and browns suitably sized pieces.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Leave space in the pan. Crowding releases enough moisture to hinder browning; cook batches when
        necessary.
      sources:
        - cia-techniques
      review_version: 0.1
  resources:
    - resource: cia-techniques
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: shallow-fry
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Shallow-frying is cooking food in a layer of hot fat that only partly submerges it.
      sources:
        - cia-frying
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Turn the food so each side contacts the oil. Keep similarly sized pieces together for more even cooking.
      sources:
        - cia-frying
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Adding too much food cools the oil and hinders browning. Leave space between pieces and use a suitable
        thermometer to monitor the oil.
      sources:
        - cia-frying
      review_version: 0.1
  resources:
    - resource: cia-frying
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: deep-fry
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Deep-frying is cooking food submerged in hot fat.
      sources:
        - cia-frying
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The oil surrounds the food, so the vessel needs room for both the food and bubbling oil. Do not fill it
        close to the rim.
      sources:
        - cia-frying
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Cook in batches to limit temperature drops and remove loose crumbs before they burn. Use equipment
        suitable for hot oil and monitor its temperature.
      sources:
        - cia-frying
      review_version: 0.1
  resources:
    - resource: cia-frying
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: stir-fry
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Stir-frying is quickly cooking small pieces in a little oil while moving them around a hot pan.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Prepare everything first and add ingredients in an order that suits their cooking times.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Uniformly cut pieces cook more evenly; crowded batches can steam instead of frying.
      sources:
        - cia-techniques
      review_version: 0.1
  resources:
    - resource: cia-techniques
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: knead
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Kneading is repeatedly working dough by pressing, folding or stretching it.
      sources:
        - kab-kneading
      review_version: 0.1
    - id: purpose
      role: purpose
      text: In wheat bread dough it develops a structure able to stretch and hold gas.
      sources:
        - kab-windowpane
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A small piece that stretches thinly without tearing can indicate developed gluten. The windowpane test
        is useful for many doughs, but the desired development still depends on the recipe.
      sources:
        - kab-windowpane
      review_version: 0.1
  resources:
    - resource: kab-kneading
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-windowpane
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: prove
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Proving is allowing yeast dough to rise before baking.
      sources:
        - kab-prove
        - kab-yeast-guide
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Fermentation produces gas while the dough rests. The recipe may distinguish an initial rise from the
        final rise after shaping.
      sources:
        - kab-prove
        - kab-yeast-guide
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Look for the specified expansion and response to a gentle press. Dough temperature changes the timing; a
        clock alone cannot tell whether it is ready.
      sources:
        - kab-prove
        - kab-yeast-guide
      review_version: 0.1
  resources:
    - resource: kab-prove
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-yeast-guide
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: cream
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Creaming is beating softened fat and sugar together in baking.
      sources:
        - kab-cream-method
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It incorporates air and distributes the sugar before other ingredients are added.
      sources:
        - kab-cream-method
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Look for the lighter, aerated texture described in the recipe. Melted butter cannot hold that structure
        in the same way, so melting is not equivalent to softening.
      sources:
        - kab-cream-method
      review_version: 0.1
  resources:
    - resource: kab-cream-method
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: whip
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Whipping is beating a mixture to incorporate air and form a foam.
      sources:
        - kab-whip
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It increases volume and creates a lighter texture, as in whipped cream or egg whites.
      sources:
        - kab-whip
        - egg-foam
      review_version: 0.1
    - id: judgement
      role: judgement
      text: "Soft peaks bend; firmer peaks hold their shape more clearly. Stop at the stage the recipe requests:
        continuing to whip cream can make it grainy and eventually separate it."
      sources:
        - kab-whip
      review_version: 0.1
  resources:
    - resource: kab-whip
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: blind-bake
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Blind-baking is baking a pastry case before adding its filling.
      sources:
        - kab-blind-bake
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It cooks or partly cooks a crust that would otherwise remain underdone beneath a filling.
      sources:
        - kab-blind-bake
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Line and weight the case when the method calls for it, then remove the weights to finish drying the
        base. A case for an uncooked filling needs a different endpoint from one that will return to the oven.
      sources:
        - kab-blind-bake
      review_version: 0.1
  resources:
    - resource: kab-blind-bake
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: deglaze
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Deglazing is adding liquid to a cooked-in pan to loosen browned deposits.
      sources:
        - cia-sear
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It carries those deposits into a sauce or braising liquid.
      sources:
        - cia-sear
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Browned deposits contribute flavour; burned residues can make the result bitter. Judge the pan before
        adding the liquid rather than treating every dark patch as desirable.
      sources:
        - cia-sear
      review_version: 0.1
  resources:
    - resource: cia-sear
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: reduce
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Reducing is cooking a liquid so evaporation decreases its volume.
      sources:
        - cia-reduce
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It concentrates flavour and may thicken a sauce.
      sources:
        - cia-reduce
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Cook uncovered when evaporation is wanted. Stop at the recipe’s consistency or volume cue; continuing
        can make a sauce too concentrated or thick.
      sources:
        - cia-reduce
      review_version: 0.1
  resources:
    - resource: cia-reduce
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: caramelise
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Caramelising is browning sugars through heating.
      sources:
        - caramelisation
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It develops colour and flavours ranging from gentle caramel to darker, more bitter notes.
      sources:
        - caramelisation
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: For caramel, the wet method starts with sugar and liquid; the dry method starts with sugar alone. The
        added water must evaporate before a wet caramel can brown substantially.
      sources:
        - kab-caramel
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Watch the changing colour closely as the syrup darkens. Have the next ingredients ready before starting,
        because a caramel can move past the wanted stage quickly.
      sources:
        - kab-caramel
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: Browning meat is principally associated with Maillard reactions, involving sugars and amino compounds.
        That is different from caramelising sugar, even though recipes sometimes use the same word loosely.
      sources:
        - cia-sear
      review_version: 0.1
  resources:
    - resource: caramelisation
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-caramel
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: cia-sear
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: process
    id: confit
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Confit, in the traditional duck preparation, is salt-curing followed by slow cooking under fat.
      sources:
        - cia-confit
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It makes the meat tender and provides a preparation that can later be reheated or crisped.
      sources:
        - cia-confit
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Cure the meat under refrigeration, then cook it gently in sufficient fat according to a reliable recipe.
        The fat should not be treated like a deep-frying bath.
      sources:
        - cia-confit
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Tender meat and crisp skin are separate goals. The slow cooking develops tenderness; a later pan or oven
        step can crisp the skin.
      sources:
        - cia-confit
      review_version: 0.1
    - id: context
      role: context
      text: The name has preservation origins, but a layer of fat does not make an arbitrary home preparation
        shelf-stable. The linked duck method uses refrigeration; do not infer room-temperature storage from
        the word confit.
      sources:
        - cia-confit
      review_version: 0.1
  resources:
    - resource: cia-confit
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: contrast-with
      target:
        kind: process
        id: deep-fry
      note: Both use fat, but traditional duck confit uses much gentler cooking.
      sources:
        - cia-confit
        - cia-frying
      review_version: 0.1
- target:
    kind: process
    id: brine
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Brining is treating food with salt in a water solution; dry-brining applies salt directly.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: purpose
      role: purpose
      text: For poultry, it seasons the meat and can reduce moisture loss during cooking.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Salt affects muscle proteins and the way they retain water. In dry-brining, moisture drawn from the meat
        forms a brine at the surface.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use a recipe matched to the food and its size. Already salted or enhanced poultry needs particular
        attention to the label before adding more salt.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: context
      role: context
      text: Keep poultry refrigerated during brining and cook it afterwards. Brining for a roast is not, by itself,
        a preservation or pathogen-killing process.
      sources:
        - fsis-brine
      review_version: 0.1
  resources:
    - resource: fsis-brine
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: smoke
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Smoking is exposing food to smoke from burning or smouldering material as part of its preparation.
      sources:
        - fsis-smoke
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It adds smoke flavour; in hot-smoking, heat also cooks the food.
      sources:
        - fsis-smoke
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: A smoker must control cooking heat as well as smoke. The chamber temperature and the food’s internal
        temperature answer different questions.
      sources:
        - fsis-smoke
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use thermometers to check both the smoker and the food. Smoke colour or elapsed time cannot establish
        that meat or poultry has reached a safe internal temperature.
      sources:
        - fsis-smoke
      review_version: 0.1
    - id: context
      role: context
      text: The linked USDA guidance concerns cooking meat and poultry by hot-smoking. It does not validate a
        cold-smoking process, curing formula or room-temperature storage method.
      sources:
        - fsis-smoke
      review_version: 0.1
  resources:
    - resource: fsis-smoke
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: commonly-used-with
      target:
        kind: equipment
        id: thermometer
      note: Monitor the cooking environment and the food’s interior separately.
      sources:
        - fsis-smoke
      review_version: 0.1
- target:
    kind: process
    id: sous-vide
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sous-vide is cooking food in a sealed pouch within a controlled-temperature bath.
      sources:
        - baldwin-sous-vide
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It allows close control of the food’s temperature and texture, with time adjusted to the particular food
        and portion.
      sources:
        - baldwin-sous-vide
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Heat must reach the centre before a holding period can have its intended effect. Thickness, starting
        temperature and the bath temperature therefore matter together.
      sources:
        - baldwin-sous-vide
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use a validated time-and-temperature process for the food. Reaching the bath’s set temperature is not
        the same as completing a pasteurisation schedule.
      sources:
        - baldwin-sous-vide
        - nsw-sous-vide
      review_version: 0.1
    - id: context
      role: context
      text: Serving immediately and chilling for later use are different workflows. Sealing a pouch does not
        sterilise its contents; cooling and storage need their own controls.
      sources:
        - nsw-sous-vide
      review_version: 0.1
    - id: uses
      role: uses
      text: A brief final sear can add surface browning after the controlled bath. That finishing step should not be
        confused with the preceding cooking or safety process.
      sources:
        - baldwin-sous-vide
      review_version: 0.1
  resources:
    - resource: baldwin-sous-vide
      role: introduction
      order: 1
      review_version: 0.1
    - resource: nsw-sous-vide
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: temper-chocolate
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tempering chocolate is controlling the crystallisation of its cocoa butter through temperature and
        handling.
      sources:
        - callebaut-temper
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It helps chocolate set with a firm, glossy finish and release cleanly from moulds.
      sources:
        - callebaut-temper
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The chocolate is melted, cooled to encourage suitable crystals, then brought to its working condition.
        Different methods achieve this sequence in different ways.
      sources:
        - callebaut-temper
      review_version: 0.1
    - id: selection
      role: selection
      text: Use the curve for the chocolate being worked. Dark, milk, white and other formulations do not all share
        one temperature schedule.
      sources:
        - callebaut-temper
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Test a small sample before coating or moulding the full batch. Keep the working chocolate within its
        specified range; overheating can undo the crystal structure just established.
      sources:
        - callebaut-temper
      review_version: 0.1
  resources:
    - resource: callebaut-temper
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: grill
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Grilling is cooking food with strong radiant heat, commonly over a heated grate.
      sources:
        - weber-zones
      review_version: 0.1
    - id: purpose
      role: purpose
      text: Direct heat can brown the surface quickly, especially on smaller, naturally tender portions.
      sources:
        - weber-zones
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: With direct grilling, food sits above the heat source. An adjacent indirect zone lets thicker pieces
        continue cooking with less intense surface heat.
      sources:
        - weber-zones
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Move food away from direct heat if the outside is browning faster than the centre cooks. A two-zone
        arrangement makes that adjustment possible without stopping the cooking.
      sources:
        - weber-zones
      review_version: 0.1
    - id: context
      role: context
      text: On charcoal equipment, fuel and airflow affect heat. Use the appliance’s vent guidance rather than
        treating one fixed vent position as suitable for every grill.
      sources:
        - weber-charcoal
      review_version: 0.1
  resources:
    - resource: weber-zones
      role: introduction
      order: 1
      review_version: 0.1
    - resource: weber-charcoal
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: barbecue
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Barbecuing is cooking on barbecue equipment, using direct or indirect heat according to the method.
      sources:
        - weber-charcoal
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It can produce quick surface browning or slower cooking with smoke flavour. The intended result
        determines the fire arrangement.
      sources:
        - weber-zones
        - fsis-smoke
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: For indirect cooking, place the food away from the fire or active burners. A closed cooking chamber
        allows heat to circulate around it.
      sources:
        - weber-charcoal
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Manage airflow and fuel on a charcoal barbecue, and check the food’s temperature separately from the
        cooker’s. A dark exterior does not prove the centre is ready.
      sources:
        - weber-charcoal
        - fsis-smoke
      review_version: 0.1
    - id: context
      role: context
      text: "Usage varies: Weber’s UK guidance uses barbecue for several outdoor methods, while low-and-slow smoked
        meat is another common application. Follow the actual heat arrangement in a recipe rather than relying
        on the name alone."
      sources:
        - weber-charcoal
        - fsis-smoke
      review_version: 0.1
  resources:
    - resource: weber-charcoal
      role: introduction
      order: 1
      review_version: 0.1
    - resource: weber-zones
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: fsis-smoke
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: equipment
    id: chopping-board
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A chopping board is a work surface for cutting and preparing food.
      sources:
        - fsis-boards
      review_version: 0.1
    - id: care
      role: care
      text: Keep raw meat preparation separate from ready-to-eat food. Clean the board between uses; changing
        ingredients without cleaning can transfer contamination even when the surface looks tidy.
      sources:
        - fsis-boards
      review_version: 0.1
  resources:
    - resource: fsis-boards
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: paring-knife
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A paring knife is a small knife for close, controlled preparation work.
      sources:
        - wusthof-three
      review_version: 0.1
    - id: uses
      role: uses
      text: Its short blade suits trimming, peeling and detailed fruit or vegetable work. It complements a larger
        chef’s knife rather than replacing it for every cutting task.
      sources:
        - wusthof-three
      review_version: 0.1
  resources:
    - resource: wusthof-three
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: bread-knife
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A bread knife has a long serrated blade for slicing through crust and soft crumb.
      sources:
        - wusthof-three
      review_version: 0.1
    - id: uses
      role: uses
      text: The toothed edge starts a cut through a firm crust without needing the same downward pressure as a plain
        blade. Use a slicing motion rather than crushing the loaf.
      sources:
        - wusthof-three
      review_version: 0.1
  resources:
    - resource: wusthof-three
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: vegetable-peeler
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A vegetable peeler removes a thin outer layer from fruit or vegetables.
      sources:
        - oxo-peelers
      review_version: 0.1
    - id: selection
      role: selection
      text: Straight peeling blades, serrated blades and julienne blades do different jobs. A julienne peeler makes
        strips; it is not simply a sharper version of a skin-removing peeler.
      sources:
        - oxo-peelers
      review_version: 0.1
  resources:
    - resource: oxo-peelers
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: grater
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A grater has sharpened openings or teeth that reduce food to shreds or fine particles.
      sources:
        - oxo-graters
      review_version: 0.1
    - id: selection
      role: selection
      text: Coarse, medium and fine surfaces produce different textures. A box grater may combine several surfaces;
        a narrow fine grater is useful for tasks such as citrus zest.
      sources:
        - oxo-graters
      review_version: 0.1
  resources:
    - resource: oxo-graters
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: wooden-spoon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A wooden spoon is a handled wooden utensil for stirring and serving.
      sources:
        - oxo-wooden-spoon
      review_version: 0.1
    - id: uses
      role: uses
      text: It is useful for stirring soup and breaking up soft mixtures in a pan. Head shape affects how well it
        reaches corners; hand-wash and dry a wooden utensil according to its care instructions.
      sources:
        - oxo-wooden-spoon
      review_version: 0.1
  resources:
    - resource: oxo-wooden-spoon
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: tongs
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tongs are paired gripping arms used to lift and turn food.
      sources:
        - oxo-tongs
        - cia-frying
      review_version: 0.1
    - id: uses
      role: uses
      text: They help move pieces on a grill or in a pan without piercing them. Choose a length that gives control
        while keeping the hand clear of the cooking surface.
      sources:
        - oxo-tongs
        - cia-frying
      review_version: 0.1
  resources:
    - resource: oxo-tongs
      role: introduction
      order: 1
      review_version: 0.1
    - resource: cia-frying
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: colander
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A colander is a perforated vessel that drains liquid while holding larger pieces of food.
      sources:
        - oxo-draining
      review_version: 0.1
    - id: uses
      role: uses
      text: "It is useful for draining pasta and rinsing produce. Hole size matters: small grains may need a finer
        strainer than the one used for large pasta shapes."
      sources:
        - oxo-draining
      review_version: 0.1
  resources:
    - resource: oxo-draining
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: sieve
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A kitchen sieve holds a mesh screen within a frame.
      sources:
        - oxo-sieve
      review_version: 0.1
    - id: uses
      role: uses
      text: It separates smaller solids from liquid and can rinse ingredients that would fall through a coarse
        colander. Choose mesh fineness and a stable support to suit the job.
      sources:
        - oxo-sieve
      review_version: 0.1
  resources:
    - resource: oxo-sieve
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: rolling-pin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A rolling pin is a cylindrical tool for flattening dough or pastry.
      sources:
        - kab-pin
      review_version: 0.1
    - id: selection
      role: selection
      text: Handled rollers and handle-free French pins offer different ways to apply pressure. Choose a form that
        lets you control thickness and steer the dough comfortably.
      sources:
        - kab-pin
      review_version: 0.1
  resources:
    - resource: kab-pin
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: baking-tray
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A baking tray is a shallow oven pan used to support food during baking.
      sources:
        - kab-pans
      review_version: 0.1
    - id: selection
      role: selection
      text: Rimmed trays contain juices and loose pieces; rimless cookie sheets make sliding baked items off easier.
        Leave room around the tray for heat to circulate.
      sources:
        - kab-pans
      review_version: 0.1
  resources:
    - resource: kab-pans
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: loaf-tin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A loaf tin is a deep rectangular baking pan that supports a loaf as it rises and sets.
      sources:
        - kab-pans
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use the dimensions specified by the recipe. A different capacity changes batter depth or dough support,
        so two tins both called loaf tins may give different results.
      sources:
        - kab-pans
      review_version: 0.1
  resources:
    - resource: kab-pans
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: muffin-tin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A muffin tin is a baking pan divided into individual wells.
      sources:
        - kab-pans
      review_version: 0.1
    - id: selection
      role: selection
      text: Mini, standard and larger wells hold different amounts. Match the pan to the recipe rather than assuming
        the same number of wells means the same capacity.
      sources:
        - kab-pans
      review_version: 0.1
  resources:
    - resource: kab-pans
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: cooling-rack
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A cooling rack is an open framework that raises baked food above the work surface.
      sources:
        - allclad-rack
      review_version: 0.1
    - id: judgement
      role: judgement
      text: The gaps let air circulate underneath. Only use a rack inside an oven when its maker specifies that use;
        a rack sold for cooling is not automatically oven-safe.
      sources:
        - allclad-rack
      review_version: 0.1
  resources:
    - resource: allclad-rack
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: measuring-cup
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A measuring cup is a marked vessel or fixed-capacity scoop for measuring volume.
      sources:
        - oxo-cup
        - kab-weight
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Read the stated unit markings. A cup measure does not establish an ingredient’s weight, and different
        cup conventions should not be silently treated as one volume.
      sources:
        - oxo-cup
        - kab-weight
      review_version: 0.1
  resources:
    - resource: oxo-cup
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-weight
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: stock-pot
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A stock pot is a deep cooking pot designed to hold substantial quantities of liquid and ingredients.
      sources:
        - allclad-stockpot
        - cia-stock
        - cia-reduce
      review_version: 0.1
    - id: uses
      role: uses
      text: It suits stock, soup and other liquid-based cooking. A lid helps retain heat and moisture; leaving it
        off allows more evaporation.
      sources:
        - cia-stock
        - cia-reduce
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose a capacity that accommodates the ingredients without filling to the rim. Check the pot’s hob
        compatibility and the weight of a filled pot before selecting a size.
      sources:
        - allclad-stockpot
        - cia-stock
        - cia-reduce
      review_version: 0.1
  resources:
    - resource: allclad-stockpot
      role: introduction
      order: 1
      review_version: 0.1
    - resource: cia-stock
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: cia-reduce
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: equipment
    id: saute-pan
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A sauté pan is a wide, relatively shallow pan commonly made with straight sides.
      sources:
        - allclad-saute
        - allclad-care
      review_version: 0.1
    - id: uses
      role: uses
      text: Its cooking surface suits browning, while the sides contain liquid when making a pan sauce or simmering
        a one-pan dish.
      sources:
        - allclad-saute
        - allclad-care
      review_version: 0.1
    - id: selection
      role: selection
      text: A lid is useful for covered cooking. Check the handle and lid limits separately before transferring the
        pan to an oven.
      sources:
        - allclad-care
      review_version: 0.1
  resources:
    - resource: allclad-saute
      role: introduction
      order: 1
      review_version: 0.1
    - resource: allclad-care
      role: deeper-explanation
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: deglaze
      note: Its broad base and sides can accommodate the liquid added for a pan sauce.
      sources:
        - allclad-saute
      review_version: 0.1
- target:
    kind: equipment
    id: roasting-tin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A roasting tin is an oven pan with sides that contain food and cooking juices.
      sources:
        - allclad-roaster
      review_version: 0.1
    - id: uses
      role: uses
      text: A fitted rack raises a joint or bird above the base. Removing a detachable rack allows some roasting
        pans to serve as baking dishes.
      sources:
        - allclad-roaster
      review_version: 0.1
    - id: selection
      role: selection
      text: Check that the pan and handles fit the oven and can be gripped with oven gloves. A rack’s coating and
        heat limit may differ from the pan itself.
      sources:
        - allclad-roaster
      review_version: 0.1
  resources:
    - resource: allclad-roaster
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: pie-dish
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A pie dish is a shallow baking vessel shaped to hold a pastry case and filling.
      sources:
        - kab-pie-pan
      review_version: 0.1
    - id: selection
      role: selection
      text: Metal, glass and ceramic transfer heat differently. Pan material can affect how readily the bottom crust
        browns.
      sources:
        - kab-pie-pan
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use the recipe’s pan size and material where specified. Observe the maker’s thermal-shock precautions
        for glass or ceramic rather than moving a cold dish straight onto a very hot surface.
      sources:
        - kab-pie-pan
      review_version: 0.1
  resources:
    - resource: kab-pie-pan
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: hand-mixer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A hand mixer is an electric mixer held over a separate bowl while it works.
      sources:
        - ka-mixers
      review_version: 0.1
    - id: uses
      role: uses
      text: It mixes batters and whips lighter mixtures without a fixed countertop bowl. The user guides the beaters
        around the ingredients.
      sources:
        - ka-mixers
      review_version: 0.1
    - id: selection
      role: selection
      text: Long mixing sessions or large, stiff batches can be demanding to hold. Choose attachments and loads
        permitted by the model rather than assuming a hand mixer can handle every stand-mixer task.
      sources:
        - ka-mixers
      review_version: 0.1
  resources:
    - resource: ka-mixers
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: whip
      note: Appropriate beaters or whisks can aerate suitable mixtures.
      sources:
        - ka-mixers
      review_version: 0.1
- target:
    kind: equipment
    id: immersion-blender
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An immersion blender is a handheld motor unit with a blade at the end of an arm placed into the food.
      sources:
        - ka-processor
      review_version: 0.1
    - id: uses
      role: uses
      text: It purées soup and blends sauces in a suitable vessel, reducing the need to transfer the mixture to a
        separate jug.
      sources:
        - ka-processor
      review_version: 0.1
    - id: selection
      role: selection
      text: Some models accept whisk or chopper accessories. Those attachments add different functions; the basic
        blending arm is not itself a slicing disc or a whisk.
      sources:
        - ka-processor
      review_version: 0.1
  resources:
    - resource: ka-processor
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: food-processor
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A food processor is a powered appliance with a work bowl and cutting blade or interchangeable discs.
      sources:
        - ka-processor
      review_version: 0.1
    - id: uses
      role: uses
      text: A bowl blade chops or purées; slicing and shredding discs produce more regular pieces as food passes
        through a feed tube.
      sources:
        - ka-processor
      review_version: 0.1
    - id: selection
      role: selection
      text: Capacity and available attachments vary. Match the blade or disc to the preparation, and check the
        model’s instructions before using it for dough.
      sources:
        - ka-processor
      review_version: 0.1
  resources:
    - resource: ka-processor
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: potato-masher
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A potato masher is a handled tool that presses cooked food through or around an open mashing head.
      sources:
        - oxo-masher
      review_version: 0.1
    - id: uses
      role: uses
      text: Repeated downward pressure breaks tender potatoes into a mash. A perforated plate is one common design.
      sources:
        - oxo-masher
      review_version: 0.1
    - id: selection
      role: selection
      text: Head shape and openings affect the result and the effort required. Choose a tool that fits the vessel
        and allows a comfortable downward stroke.
      sources:
        - oxo-masher
      review_version: 0.1
  resources:
    - resource: oxo-masher
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: mash
      note: It presses softened food into smaller pieces.
      sources:
        - oxo-masher
      review_version: 0.1
- target:
    kind: equipment
    id: mortar-and-pestle
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A mortar and pestle combines a bowl with a hand-held pounding and grinding tool.
      sources:
        - lc-mortar
      review_version: 0.1
    - id: uses
      role: uses
      text: It crushes spices and works herbs into a rough mixture or paste. The cook controls the texture through
        pressure and repeated movement.
      sources:
        - lc-mortar
      review_version: 0.1
    - id: selection
      role: selection
      text: The linked stoneware example illustrates one material. Choose a size and surface suited to the
        ingredients, and follow that material’s cleaning instructions.
      sources:
        - lc-mortar
      review_version: 0.1
  resources:
    - resource: lc-mortar
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: crush
      note: The pestle applies pressure against the mortar’s surface.
      sources:
        - lc-mortar
      review_version: 0.1
- target:
    kind: equipment
    id: thermometer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A kitchen thermometer measures temperature in food or a cooking environment.
      sources:
        - fsis-thermometers
      review_version: 0.1
    - id: selection
      role: selection
      text: Instant-read probes, leave-in probes and appliance thermometers have different jobs. A thermometer
        suitable for checking food briefly is not automatically safe to leave in an oven.
      sources:
        - fsis-thermometers
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Place the sensing area where the reading is needed, following the instrument’s instructions. A shallow
        insertion can miss the centre, while contact with bone or the pan can distort a food reading.
      sources:
        - fsis-thermometers
      review_version: 0.1
  resources:
    - resource: fsis-thermometers
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: dutch-oven
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A Dutch oven is a heavy, lidded cooking pot, commonly made from cast iron.
      sources:
        - lodge-guide
      review_version: 0.1
    - id: uses
      role: uses
      text: It suits braises, stews and oven cooking where a covered vessel is useful. Its substantial body retains
        heat after the heat source is reduced.
      sources:
        - lodge-guide
      review_version: 0.1
    - id: selection
      role: selection
      text: Bare seasoned iron and enamel-coated iron need different care. Dark interiors can be enamel too, so
        colour alone does not tell you whether to season the surface.
      sources:
        - lodge-enamel
      review_version: 0.1
    - id: care
      role: care
      text: For Lodge enamel, heat gradually and avoid heating the pot empty on the hob. Protect the coating from
        harsh abrasion and sudden temperature changes.
      sources:
        - lodge-enamel
      review_version: 0.1
    - id: context
      role: context
      text: The lid, knob and handles may set the oven limit. Follow the actual product’s rating rather than
        transferring a camp-oven or bare-iron practice to every Dutch oven.
      sources:
        - lodge-guide
        - lodge-enamel
      review_version: 0.1
  resources:
    - resource: lodge-guide
      role: introduction
      order: 1
      review_version: 0.1
    - resource: lodge-enamel
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: lodge-care
      role: deeper-explanation
      order: 3
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: stew
      note: A lidded pot contains liquid during slow cooking.
      sources:
        - lodge-guide
      review_version: 0.1
- target:
    kind: equipment
    id: wok
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A wok is a deep cooking pan with sloping sides, available with a rounded or flattened base.
      sources:
        - wok-season
        - wok-round
      review_version: 0.1
    - id: uses
      role: uses
      text: Its shape suits moving small pieces during stir-frying. It can serve other cooking methods when used
        with the appropriate equipment and heat.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: selection
      role: selection
      text: Match the base to the hob. A round-bottomed wok may need a suitable support ring; a flat base is
        designed to stand differently.
      sources:
        - wok-round
      review_version: 0.1
    - id: care
      role: care
      text: Uncoated carbon steel develops a protective seasoning layer. A factory non-stick coating is different
        and should not receive the high-heat seasoning treatment intended for bare steel.
      sources:
        - wok-season
      review_version: 0.1
    - id: judgement
      role: judgement
      text: "Identify the surface before first use: bare, pre-seasoned and coated woks are not interchangeable care
        cases. Follow the maker’s initial cleaning and heating directions."
      sources:
        - wok-season
        - wok-round
      review_version: 0.1
  resources:
    - resource: wok-season
      role: introduction
      order: 1
      review_version: 0.1
    - resource: wok-round
      role: deeper-explanation
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: stir-fry
      note: The sloping sides provide room to move small pieces.
      sources:
        - cia-techniques
      review_version: 0.1
- target:
    kind: equipment
    id: mandoline
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A mandoline is a slicing tool that moves food across a fixed blade to make repeated cuts.
      sources:
        - oxo-mandoline
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It produces slices of fairly consistent thickness, useful when pieces should cook or present evenly.
      sources:
        - oxo-mandoline
      review_version: 0.1
    - id: selection
      role: selection
      text: Some models provide interchangeable blades for julienne or patterned cuts. Adjustments and blade
        positions depend on the design.
      sources:
        - oxo-mandoline
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use the supplied food holder and stop when the remaining piece cannot be held safely. The exposed blade
        is sharp even when the slicer is resting on the worktop.
      sources:
        - oxo-mandoline
      review_version: 0.1
    - id: care
      role: care
      text: Handle removable blades carefully during cleaning and store them in their designated protected position.
        A folded or locked frame does not make loose blades safe to grasp.
      sources:
        - oxo-mandoline
      review_version: 0.1
  resources:
    - resource: oxo-mandoline
      role: introduction
      order: 1
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: slice
      note: A fixed blade makes repeated slices; thickness settings vary by model.
      sources:
        - oxo-mandoline
      review_version: 0.1
- target:
    kind: equipment
    id: stand-mixer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A stand mixer is a powered mixer mounted above a supported mixing bowl.
      sources:
        - ka-mixers
      review_version: 0.1
    - id: uses
      role: uses
      text: It can mix batters, aerate mixtures and knead suitable doughs without the cook holding the motor unit.
      sources:
        - ka-mixers
      review_version: 0.1
    - id: selection
      role: selection
      text: A flat beater mixes many batters, a wire whisk aerates suitable mixtures, and a dough hook works dough.
        These tools are not interchangeable for every recipe.
      sources:
        - ka-beaters
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use the maker’s recommended speed and capacity for the dough or mixture. A stronger-looking machine is
        not permission to exceed its stated load.
      sources:
        - ka-beaters
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: A hand mixer is guided around a separate bowl, while a food processor primarily cuts with blades or
        discs. Optional attachments may overlap functions without making the basic machines identical.
      sources:
        - ka-mixers
        - ka-processor
      review_version: 0.1
  resources:
    - resource: ka-mixers
      role: introduction
      order: 1
      review_version: 0.1
    - resource: ka-beaters
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: ka-processor
      role: deeper-explanation
      order: 3
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: knead
      note: A suitable dough hook works dough within the machine’s stated limits.
      sources:
        - ka-beaters
      review_version: 0.1
- target:
    kind: equipment
    id: pasta-machine
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A roller pasta machine passes dough between adjustable rollers to form sheets.
      sources:
        - marcato-roller
      review_version: 0.1
    - id: uses
      role: uses
      text: Sheets can be used for lasagne or cut into other shapes; compatible cutting attachments make particular
        widths of pasta.
      sources:
        - marcato-roller
      review_version: 0.1
    - id: selection
      role: selection
      text: Hand-cranked and motor-driven arrangements differ. Check attachment compatibility and the machine’s
        available roller widths rather than assuming every accessory fits.
      sources:
        - marcato-roller
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A numbered thickness dial is a machine setting, not a universal thickness unit. Use the instructions and
        the sheet required by the recipe together.
      sources:
        - marcato-roller
      review_version: 0.1
    - id: care
      role: care
      text: Marcato advises against washing the machine under running water or in a dishwasher. Its guidance
        distinguishes the body and rollers from removable combs or scrapers; clean only the parts permitted by
        the manual and dry them fully.
      sources:
        - marcato-clean
      review_version: 0.1
  resources:
    - resource: marcato-roller
      role: introduction
      order: 1
      review_version: 0.1
    - resource: marcato-clean
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: asparagus
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Asparagus is the young edible shoot of a perennial vegetable plant. It is steamed, roasted, grilled or briefly cooked for salads and side dishes.
      sources:
        - purdue-asparagus
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose firm spears with compact tips; avoid slimy or yellowing tips. Trim the fibrous lower portion before cooking.
      sources:
        - purdue-asparagus
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Tender tips cook quickly. Check the thickest part of a spear rather than assuming every bunch needs the same cooking time.
      sources:
        - purdue-asparagus
      review_version: 0.1
  resources:
    - resource: purdue-asparagus
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: beetroot
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Beetroot is the swollen edible root of the beet plant, available in red, golden and striped varieties. It is eaten grated raw, roasted, boiled or prepared in pickles and salads.
      sources:
        - purdue-beet
      review_version: 0.1
    - id: selection
      role: selection
      text: Look for firm roots without damaged skin. Sound leaves can be cooked as greens; keep them separately from the roots.
      sources:
        - purdue-beet
      review_version: 0.1
    - id: uses
      role: uses
      text: Red beetroot colours surrounding ingredients readily. Cook roots until a knife enters easily when a tender result is wanted.
      sources:
        - purdue-beet
      review_version: 0.1
  resources:
    - resource: purdue-beet
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: blueberries
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Blueberries are small edible berries with blue skins, grown in several cultivated and wild types. They are eaten fresh and used in muffins, pies, sauces and other desserts.
      sources:
        - purdue-blueberry
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose firm berries and remove damaged or leaking fruit. Refrigerate and wash the portion you are about to use rather than wetting the whole stored batch.
      sources:
        - purdue-blueberry
      review_version: 0.1
  resources:
    - resource: purdue-blueberry
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: cabbage
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cabbage is a leafy vegetable whose overlapping leaves form a compact head. It is shredded for slaws, cooked in soups and stir-fries, or fermented in preparations such as sauerkraut.
      sources:
        - purdue-cabbage
      review_version: 0.1
    - id: selection
      role: selection
      text: Green, red and crinkled Savoy cabbages differ in colour and texture. Look for a firm head with fresh leaves rather than splits or soft spots.
      sources:
        - purdue-cabbage
      review_version: 0.1
    - id: uses
      role: uses
      text: Remove damaged outer leaves and cut on a stable flat surface. Thin shreds suit quick cooking and slaws; larger pieces keep more structure.
      sources:
        - purdue-cabbage
      review_version: 0.1
  resources:
    - resource: purdue-cabbage
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: celery
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Celery is a vegetable grown for its crisp leaf stalks and aromatic leaves. It is eaten raw and used to flavour soups, salads and cooked savoury dishes.
      sources:
        - purdue-celery
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose crisp stalks and unwilted leaves. Separate and rinse the stalks before cutting so dirt trapped near the base is removed.
      sources:
        - purdue-celery
      review_version: 0.1
    - id: context
      role: context
      text: The leaves have culinary use too. Celeriac is grown for a swollen base, while celery seed is a concentrated seasoning; neither is the same preparation as chopped stalks.
      sources:
        - purdue-celery
      review_version: 0.1
  resources:
    - resource: purdue-celery
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: caraway
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Caraway is an aromatic spice commonly sold as small dried seeds. It is used in breads, slaws, cheese and potato dishes.
      sources:
        - illinois-caraway
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Its flavour has a liquorice-like character. Use it deliberately as a seasoning rather than treating it as a neutral seed garnish.
      sources:
        - illinois-caraway
      review_version: 0.1
    - id: context
      role: context
      text: The plant also has edible leaves and roots. The usual spice ingredient refers to the dried seed-like fruits, not those other parts.
      sources:
        - illinois-caraway
      review_version: 0.1
  resources:
    - resource: illinois-caraway
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: chives
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Chives are the slender, hollow leaves of a perennial onion-family herb. They are chopped into salads, dips, soups, egg and cheese dishes, or used as a garnish.
      sources:
        - illinois-chives
      review_version: 0.1
    - id: sensory
      role: sensory
      text: The onion flavour is comparatively mild. Freshly cut leaves give small dishes an onion note without the texture of chopped onion bulbs.
      sources:
        - illinois-chives
      review_version: 0.1
  resources:
    - resource: illinois-chives
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: bay-leaf
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Bay leaf is the aromatic leaf of culinary bay laurel. It flavours soups, stews and meat, fish or poultry dishes, often as part of a bouquet garni.
      sources:
        - illinois-bay
      review_version: 0.1
    - id: context
      role: context
      text: This page concerns culinary bay laurel. A plant called laurel is not automatically a culinary substitute.
      sources:
        - illinois-bay
      review_version: 0.1
    - id: storage
      role: storage
      text: Dry leaves before sealing them for storage. Use food-grade leaves from an identified culinary source.
      sources:
        - illinois-bay
      review_version: 0.1
  resources:
    - resource: illinois-bay
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: rosemary
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Rosemary is an evergreen culinary herb with narrow, needle-like leaves. It seasons meats, vegetables and breads, using fresh or dried foliage.
      sources:
        - illinois-rosemary
      review_version: 0.1
    - id: uses
      role: uses
      text: Tender tips and leaves can be harvested as needed. The woody stems and the leaves behave differently in a dish; leaves can be stripped for chopping, while sound longer stems can serve as aromatic skewers.
      sources:
        - illinois-rosemary
      review_version: 0.1
  resources:
    - resource: illinois-rosemary
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: arugula
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Arugula is a peppery leafy green also commonly called rocket. It is eaten in salads and used as a fresh topping or lightly cooked green.
      sources:
        - illinois-arugula
      review_version: 0.1
    - id: uses
      role: uses
      text: Rinse the leaves and dry them before dressing. Their assertive flavour can be balanced with milder salad leaves rather than hidden under a heavy dressing.
      sources:
        - illinois-arugula
      review_version: 0.1
  resources:
    - resource: illinois-arugula
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: allspice
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Allspice is a spice made from the dried berries of an evergreen tree. It seasons stews, brines, pickles, spiced drinks and baking.
      sources:
        - mccormick-allspice
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Its aroma recalls several warm spices, but allspice is a single spice rather than a ready-made mixture. Whole berries suit infusions; the ground spice disperses through batters and spice rubs.
      sources:
        - mccormick-allspice
      review_version: 0.1
  resources:
    - resource: mccormick-allspice
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: almonds
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Almonds are edible kernels sold whole, sliced, chopped or ground. They add flavour and texture to baking, sauces, confectionery and savoury dishes.
      sources:
        - almond-forms
      review_version: 0.1
    - id: selection
      role: selection
      text: "Choose the form the dish needs: thin slices are different from ground meal, while blanching removes the brown skin."
      sources:
        - almond-forms
      review_version: 0.1
    - id: storage
      role: storage
      text: Protect almonds from heat, moisture and air. Cutting and grinding expose more surface to oxidation, so stale flavours can develop more readily than in intact kernels.
      sources:
        - almond-oxidation
      review_version: 0.1
  resources:
    - resource: almond-forms
      role: introduction
      order: 1
      review_version: 0.1
    - resource: almond-oxidation
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: cinnamon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cinnamon is an aromatic bark spice sold in sticks or ground form. It flavours baking, desserts, drinks and savoury preparations.
      sources:
        - kab-cinnamon
      review_version: 0.1
    - id: selection
      role: selection
      text: Ceylon cinnamon and the several cassia types have different strengths and textures. Ceylon sticks are thin and crumbly; a jar labelled simply cinnamon does not specify a single flavour profile.
      sources:
        - kab-cinnamon
      review_version: 0.1
  resources:
    - resource: kab-cinnamon
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: cloves
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cloves are the dried aromatic flower buds of the clove tree. They are used whole or ground to season food and drinks.
      sources:
        - kew-clove
      review_version: 0.1
    - id: sensory
      role: sensory
      text: Clove has a strong aroma associated with its essential oil. Small amounts can dominate a mixture, so the whole and ground forms should be chosen deliberately.
      sources:
        - kew-clove
      review_version: 0.1
  resources:
    - resource: kew-clove
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: sesame-seeds
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sesame seeds are small edible oilseeds used whole or ground. They are sprinkled over breads and vegetables, toasted for seasoning, or ground into pastes.
      sources:
        - mccormick-sesame
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose raw or toasted seeds according to the recipe. A toasted garnish and a smooth sesame paste give different textures even though both start with the same ingredient.
      sources:
        - mccormick-sesame
      review_version: 0.1
  resources:
    - resource: mccormick-sesame
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: bacon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Bacon is cured meat, most commonly pork, sold in cuts and styles that vary by region. It is cooked for breakfasts and sandwiches or used to flavour soups, vegetables and other savoury dishes.
      sources:
        - fsis-bacon-archive
      review_version: 0.1
    - id: selection
      role: selection
      text: Belly bacon has alternating meat and fat; loin and other cuts give a different balance. Smoking, sweetness, slice thickness and whether it is already cooked matter more than the name alone.
      sources:
        - fsis-bacon-archive
      review_version: 0.1
    - id: care
      role: care
      text: Curing does not make ordinary raw bacon ready to eat or safe to keep unrefrigerated. Follow the package storage and cooking directions; fully cooked and shelf-stable products must be identified as such.
      sources:
        - fsis-bacon-archive
      review_version: 0.1
  resources:
    - resource: fsis-bacon-archive
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: balsamic-vinegar
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Balsamic vinegar is a sweet-sour grape-based condiment sold in several production styles. It is used in dressings, sauces and finishing drizzles.
      sources:
        - modena-balsamic
        - balsamic-culinary
      review_version: 0.1
    - id: selection
      role: selection
      text: Traditional balsamic vinegar of Modena and Balsamic Vinegar of Modena are different products, with different production requirements. Read the full label rather than assuming every balsamic is a long-aged traditional vinegar.
      sources:
        - modena-balsamic
      review_version: 0.1
  resources:
    - resource: modena-balsamic
      role: introduction
      order: 1
      review_version: 0.1
    - resource: balsamic-culinary
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: black-tea
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Black tea is tea made from leaves that undergo extensive oxidation during processing. It is infused in water for hot or cold drinks.
      sources:
        - uktea-types
      review_version: 0.1
    - id: context
      role: context
      text: Assam, Darjeeling and Ceylon indicate different origins and styles, while Earl Grey includes added bergamot flavour. A recipe calling for black tea does not specify one uniform strength or aroma.
      sources:
        - uktea-types
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose the tea for the flavour wanted, and follow its brewing guidance. Finely broken leaves and large loose leaves do not necessarily extract at the same rate.
      sources:
        - uktea-types
        - uktea-brew
      review_version: 0.1
  resources:
    - resource: uktea-types
      role: introduction
      order: 1
      review_version: 0.1
    - resource: uktea-brew
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: bread-crumbs
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Breadcrumbs are small pieces of bread, prepared fresh or dried and in different sizes. They bind fillings, coat food for frying and give baked dishes a crisp topping.
      sources:
        - goodfood-crumbs
      review_version: 0.1
    - id: selection
      role: selection
      text: Fresh crumbs are soft and absorb liquid; dried crumbs are firmer, and panko has a light flaky shape. Use the form specified rather than assuming equal volumes behave alike.
      sources:
        - goodfood-crumbs
      review_version: 0.1
    - id: uses
      role: uses
      text: Brief pulses in a processor control crumb size. Dry bread can also be crushed, while fresh bread can be grated; stop when the texture suits the dish.
      sources:
        - goodfood-crumbs
      review_version: 0.1
  resources:
    - resource: goodfood-crumbs
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: buckwheat
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Buckwheat is an edible seed used like a grain, rather than a type of wheat. Its groats and flour are used for porridge, pancakes, crêpes and noodles.
      sources:
        - wholegrains-az
      review_version: 0.1
    - id: context
      role: context
      text: The name does not mean it behaves like wheat flour in dough. Soba and other prepared products may also contain wheat, so read the ingredients when their composition matters.
      sources:
        - wholegrains-az
      review_version: 0.1
  resources:
    - resource: wholegrains-az
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: cannellini-beans
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cannellini beans are white kidney beans used as a pulse. They are cooked in soups and stews, tossed into salads or mashed into spreads.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: uses
      role: uses
      text: Dried beans must be cooked until tender; canned beans are already cooked. Treat these as different starting preparations rather than adding them at the same stage.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Cooking time varies with the beans and method. Test the centre of a bean for tenderness before finishing a dish.
      sources:
        - pulses-cook
      review_version: 0.1
  resources:
    - resource: pulses-cook
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: split-peas
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Split peas are dried peas with their skins removed and the seed halves separated. They are simmered into soups, purées and other thick pulse dishes.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: uses
      role: uses
      text: Rinse and pick over the peas before cooking. They soften and break down with simmering, which is useful when the peas are meant to thicken the dish.
      sources:
        - pulses-cook
      review_version: 0.1
    - id: context
      role: context
      text: Green and yellow split peas are sold separately. They are not the same ingredient as every pulse labelled dal.
      sources:
        - pulses-cook
      review_version: 0.1
  resources:
    - resource: pulses-cook
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: coconut-oil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Coconut oil is fat extracted from the coconut kernel. It is used as a cooking fat and in baking and confectionery.
      sources:
        - tetrapak-coconut
      review_version: 0.1
    - id: selection
      role: selection
      text: Virgin coconut oil retains coconut character; refined, bleached and deodorised oil is much more neutral. Select deliberately when coconut flavour would change the dish.
      sources:
        - tetrapak-coconut
      review_version: 0.1
    - id: context
      role: context
      text: Processing terms describe different products. The word coconut alone does not tell you how strongly an oil will flavour a preparation.
      sources:
        - tetrapak-coconut
      review_version: 0.1
  resources:
    - resource: tetrapak-coconut
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: ricotta
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Ricotta is a mild fresh dairy product traditionally made by recovering curds from whey, with milk also used in commercial forms. It is used in pasta fillings, baking, spreads and desserts.
      sources:
        - dairy-fresh-cheese
      review_version: 0.1
    - id: selection
      role: selection
      text: Firm drained ricotta and smooth tub ricotta have different moisture and texture. A wet spreadable product can make a filling looser than a well-drained one.
      sources:
        - dairy-fresh-cheese
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep it refrigerated and follow the package date and handling directions. Fresh ricotta is perishable; freezing can change its texture, making it better suited to cooking after thawing.
      sources:
        - dairy-fresh-cheese
      review_version: 0.1
  resources:
    - resource: dairy-fresh-cheese
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: sardines
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sardines are small oily fish sold fresh, frozen and preserved. They are grilled, fried or roasted and are also eaten from tins or used in sauces and spreads.
      sources:
        - gbc-sardines
      review_version: 0.1
    - id: selection
      role: selection
      text: Fresh whole fish, boned fillets and canned sardines are different starting points. Check what the recipe expects before deciding whether cleaning, boning or cooking is still needed.
      sources:
        - gbc-sardines
      review_version: 0.1
    - id: uses
      role: uses
      text: Their strong flavour works with acidic dressings. Small fillets cook quickly; avoid leaving them on the heat simply because larger fish would need longer.
      sources:
        - gbc-sardines
      review_version: 0.1
  resources:
    - resource: gbc-sardines
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: tahini
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tahini is a paste made from ground sesame seeds. It is used in dips, dressings, sauces, sweets and baking.
      sources:
        - soom-tahini-faq
      review_version: 0.1
    - id: uses
      role: uses
      text: Stir separated oil back into the paste before measuring so each portion has a consistent texture. The paste can be incorporated into either sweet or savoury mixtures.
      sources:
        - soom-tahini-faq
      review_version: 0.1
    - id: context
      role: context
      text: Roasting and processing change sesame-paste flavour. Check the product rather than assuming every sesame paste matches the style a recipe expects.
      sources:
        - soom-tahini-faq
      review_version: 0.1
  resources:
    - resource: soom-tahini-faq
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: tomato-paste
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tomato paste is a thick tomato concentrate made by removing much of the fruit’s water. It adds concentrated tomato flavour, colour and body to sauces, stews and other dishes.
      sources:
        - mutti-paste
      review_version: 0.1
    - id: selection
      role: selection
      text: Standard, double and triple concentrates are not equally dilute. Read the product description; a spoonful of paste does not behave like the same volume of passata.
      sources:
        - mutti-paste
      review_version: 0.1
    - id: uses
      role: uses
      text: Use it where a dish needs tomato character without much additional liquid. Manufacturer recipes illustrate both long-cooked sauces and quick preparations.
      sources:
        - mutti-paste
      review_version: 0.1
  resources:
    - resource: mutti-paste
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: walnuts
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Walnuts are edible kernels enclosed in hard shells inside a green outer hull. They are eaten as nuts and used in baking, sauces, salads and fillings.
      sources:
        - uc-walnuts
        - walnuts-forms
      review_version: 0.1
    - id: storage
      role: storage
      text: Dry harvested nuts properly before storage and keep kernels protected from moisture and insects. Cool storage helps retain quality.
      sources:
        - uc-walnuts
      review_version: 0.1
    - id: selection
      role: selection
      text: Shell and hull are different coverings. For ordinary cooking, use prepared edible kernels rather than treating the outer hull as part of the ingredient.
      sources:
        - uc-walnuts
      review_version: 0.1
  resources:
    - resource: uc-walnuts
      role: introduction
      order: 1
      review_version: 0.1
    - resource: walnuts-forms
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: active-dry-yeast
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Active dry yeast is dried baker’s yeast sold as granules. It ferments bread and other doughs, producing the gas that makes them rise.
      sources:
        - kab-yeast-guide
        - kab-leavener-freshness
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The living yeast uses available sugars and releases carbon dioxide. Dough structure retains some of that gas; yeast activity alone does not guarantee a well-risen loaf.
      sources:
        - kab-yeast-guide
        - kab-leavener-freshness
      review_version: 0.1
    - id: selection
      role: selection
      text: Active dry and instant yeast have different granule sizes and can begin working at different rates. Follow the recipe and packet directions when deciding whether to dissolve the yeast first.
      sources:
        - kab-yeast-guide
        - kab-leavener-freshness
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Judge dough by its development and rise as well as elapsed time. Temperature and the amounts of salt and sugar affect fermentation.
      sources:
        - kab-yeast-guide
        - kab-leavener-freshness
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep opened yeast sealed and stored as the manufacturer directs. Heat or poor storage can reduce activity; testing an uncertain packet is preferable to assuming a failed rise is a flour problem.
      sources:
        - kab-yeast-guide
        - kab-leavener-freshness
      review_version: 0.1
  resources:
    - resource: kab-yeast-guide
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-leavener-freshness
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: buttermilk
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cultured buttermilk is milk fermented to give a tangy flavour and thicker consistency. It is used in pancakes, biscuits, cakes, dressings and other preparations.
      sources:
        - kab-buttermilk
      review_version: 0.1
    - id: context
      role: context
      text: The liquid left from churning uncultured cream into butter is also called buttermilk, but it is not the same acidic cultured product. Check which one the recipe intends.
      sources:
        - kab-make-butter
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Its acidity matters in baking-soda recipes. Replacing it with plain milk can change rise, colour and texture as well as flavour.
      sources:
        - kab-buttermilk
      review_version: 0.1
    - id: selection
      role: selection
      text: Acidified milk and thinned yoghurt are recipe-dependent alternatives, not identical ingredients. The difference is especially noticeable where buttermilk supplies much of the flavour.
      sources:
        - kab-buttermilk
      review_version: 0.1
  resources:
    - resource: kab-buttermilk
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-make-butter
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: clams
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Clams are edible bivalve shellfish enclosed by two hinged shells. They are steamed, cooked in sauces and used in soups, chowders and pasta dishes.
      sources:
        - gbc-clams
      review_version: 0.1
    - id: selection
      role: selection
      text: Buy shellfish from a regulated source. For live hard-shell clams, avoid cracked shells and those that do not close when tapped; frozen or shucked products require different checks.
      sources:
        - fda-seafood-safe
      review_version: 0.1
    - id: uses
      role: uses
      text: Clams release a savoury liquid as they cook. Their meat and cooking juices can both contribute to a sauce, while any grit needs to be kept out of the finished dish.
      sources:
        - gbc-clams
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Shells open during cooking; discard clams that remain closed. Do not use smell or appearance as a guarantee that raw shellfish are safe.
      sources:
        - fda-seafood-safe
      review_version: 0.1
    - id: context
      role: context
      text: Different clam species and sizes need different handling. Follow preparation guidance for the actual product rather than extending one short steaming time to all clams.
      sources:
        - gbc-clams
        - fda-seafood-safe
      review_version: 0.1
  resources:
    - resource: gbc-clams
      role: introduction
      order: 1
      review_version: 0.1
    - resource: fda-seafood-safe
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: sourdough-starter
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sourdough starter is a maintained mixture of flour and water containing fermenting yeasts and bacteria. It is used to raise and flavour bread and other doughs.
      sources:
        - kab-starter-create
        - kab-starter-wholegrain
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Regular refreshments supply new flour and water while keeping the amount manageable. Flour choice, temperature and feeding proportions all influence how quickly the mixture becomes active.
      sources:
        - kab-starter-create
        - kab-starter-wholegrain
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Look for a repeatable rise after feeding rather than treating a particular day on the calendar as proof of readiness. An established active starter and unfed discard serve different purposes in a recipe.
      sources:
        - kab-starter-create
        - kab-starter-wholegrain
      review_version: 0.1
    - id: care
      role: care
      text: Use clean utensils and a suitable container with room for expansion. Discard a starter with visible mould or pink or orange streaks; do not attempt to rescue it by baking.
      sources:
        - kab-starter-create
        - kab-starter-wholegrain
      review_version: 0.1
    - id: context
      role: context
      text: Changing to wholegrain flour, especially rye, can alter activity. Record the flour and feeding routine before diagnosing every slow rise as a dead culture.
      sources:
        - kab-starter-create
        - kab-starter-wholegrain
      review_version: 0.1
  resources:
    - resource: kab-starter-create
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-starter-wholegrain
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: stock
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Stock is a flavoured liquid prepared by extracting savoury ingredients into water. It is used as a base for soups, sauces, braises and other cooked dishes.
      sources:
        - cia-stock
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Bones with connective tissue can give meat stocks gelatinous body. Vegetable stocks supply flavour without that same bone-derived structure.
      sources:
        - cia-stock
      review_version: 0.1
    - id: uses
      role: uses
      text: Chicken carcasses and suitable cooking trimmings can contribute useful flavour. They are ingredients with a culinary purpose rather than automatically waste.
      sources:
        - cia-stock
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A gentle simmer and careful straining help produce a clearer stock. Salt cautiously when the stock will later be reduced, since reduction concentrates seasoning.
      sources:
        - cia-stock
      review_version: 0.1
    - id: storage
      role: storage
      text: Divide finished stock into smaller shallow containers and refrigerate promptly so it cools quickly. Do not leave a large pot cooling on the counter for hours.
      sources:
        - cia-stock
        - foodsafe-four-steps
      review_version: 0.1
  resources:
    - resource: cia-stock
      role: introduction
      order: 1
      review_version: 0.1
    - resource: foodsafe-four-steps
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: ingredient
    id: chocolate
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Chocolate is a cocoa-derived food whose formulation can include cocoa solids, cocoa butter, sugar and milk. It is eaten directly and used in baking, desserts, drinks and confectionery.
      sources:
        - kab-chocolate-types
      review_version: 0.1
    - id: selection
      role: selection
      text: Dark, milk and white chocolate are different formulations. White chocolate uses cocoa butter without the dark cocoa solids; unsweetened chocolate and sweetened bars should not be treated as equivalent.
      sources:
        - kab-chocolate-types
      review_version: 0.1
    - id: context
      role: context
      text: A cocoa percentage describes the portion derived from cocoa ingredients, including cocoa butter. It does not directly specify sweetness, flavour quality or how fluid the melted chocolate will be.
      sources:
        - kab-chocolate-types
      review_version: 0.1
    - id: uses
      role: uses
      text: Chocolate chips may be formulated to retain their shape in baking. When a recipe asks for chopped chocolate to melt smoothly, choose the specified form.
      sources:
        - kab-chocolate-types
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Match the chocolate to the preparation. A change in sugar and fat balance can affect a ganache or batter even when the same weight is used.
      sources:
        - kab-chocolate-types
      review_version: 0.1
  resources:
    - resource: kab-chocolate-types
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: ingredient
    id: rye-flour
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Rye flour is flour milled from rye grain, with varying amounts of bran and germ retained. It is used in breads, crackers, biscuits and other baking.
      sources:
        - kab-rye-types
        - kab-rye-bread
      review_version: 0.1
    - id: selection
      role: selection
      text: White, medium, dark and wholegrain rye are not interchangeable descriptions. Dark rye varies between producers; read the specification if wholegrain content matters.
      sources:
        - kab-rye-types
        - kab-rye-bread
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Rye dough does not develop the same elastic structure as a wheat bread dough. Many rye breads combine the two flours to balance flavour with loaf structure.
      sources:
        - kab-rye-types
        - kab-rye-bread
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Do not keep adding flour solely to make a rye-rich dough feel like wheat dough. Use a recipe designed for the intended rye proportion and flour type.
      sources:
        - kab-rye-types
        - kab-rye-bread
      review_version: 0.1
    - id: context
      role: context
      text: Pumpernickel flour usually refers to wholegrain rye in the cited American baking context. Regional bread names and flour labels need to be read in context.
      sources:
        - kab-rye-types
        - kab-rye-bread
      review_version: 0.1
  resources:
    - resource: kab-rye-types
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kab-rye-bread
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: beat
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Beating is vigorous repeated mixing with a spoon, whisk or mixer. Continue to the smoothness or aeration specified by the recipe.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: blend
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Blending is thoroughly combining ingredients. The instruction does not by itself require an electric blender.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: coat
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Coating is covering the surface of food with another ingredient or mixture, such as flour or breadcrumbs.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: core
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Coring is removing the central core of a fruit. Cut away the core and seeds while retaining the surrounding flesh.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: drain
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Draining is separating liquid from food by letting it run away. A colander or strainer retains the solids.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: toss
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tossing is mixing food with a light lifting and turning motion. It distributes ingredients without pressing them together.
      sources:
        - purdue-cooking-terms
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: cube
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cubing is cutting food into roughly equal-sided pieces. The recipe determines their size.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: dissolve
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Dissolving is incorporating a soluble ingredient into a liquid to form a solution, as with sugar in water.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: dredge
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Dredging is covering food lightly with a fine dry ingredient, such as flour, before cooking.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: grind
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Grinding is reducing food to small particles by crushing or cutting it mechanically. Choose the coarseness needed by the recipe.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: stir
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Stirring is moving a utensil through a mixture to combine its contents.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: deseed
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Deseeding is removing seeds from an ingredient before using the remaining flesh.
      sources:
        - goodfood-guacamole-method
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: For a chilli, open it lengthways and scrape out the seeds. The linked guacamole method illustrates this preparation.
      sources:
        - goodfood-guacamole-method
      review_version: 0.1
  resources:
    - resource: goodfood-guacamole-method
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: fluff
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Fluffing is gently loosening and separating cooked grains with a fork or similar utensil.
      sources:
        - goodfood-rice-method
      review_version: 0.1
    - id: purpose
      role: purpose
      text: For rice intended to have separate grains, lift through it lightly before serving. Mashing would break the grains rather than separate them.
      sources:
        - goodfood-rice-method
      review_version: 0.1
  resources:
    - resource: goodfood-rice-method
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: layer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Layering is arranging ingredients in successive levels.
      sources:
        - goodfood-lasagne-method
      review_version: 0.1
    - id: uses
      role: uses
      text: Lasagne alternates pasta and sauce rather than mixing them together. Follow the recipe’s order and coverage so each portion includes the intended components.
      sources:
        - goodfood-lasagne-method
      review_version: 0.1
  resources:
    - resource: goodfood-lasagne-method
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: melt
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Melting is heating a solid ingredient until it becomes liquid.
      sources:
        - kab-melt-chocolate
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use heat suited to the ingredient. Chocolate needs gentle, controlled heating; stray water can make plain melting chocolate seize into lumps.
      sources:
        - kab-melt-chocolate
      review_version: 0.1
  resources:
    - resource: kab-melt-chocolate
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: air-fry
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Air frying is cooking with rapidly circulating hot air in an air fryer.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The fan moves hot air around the food to dry and brown its surface. This is convection cooking, without submerging the food in oil.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Leave room for air circulation and turn or shake food when the recipe requires it. A crowded basket can cook unevenly.
      sources:
        - maine-air-fryer
      review_version: 0.1
  resources:
    - resource: maine-air-fryer
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: baste
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Basting is applying liquid or fat to food during cooking.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It coats the surface with juices, fat or sauce. It does not establish whether meat is safely cooked; use the appropriate internal-temperature check.
      sources:
        - fsis-thermometers
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
    - resource: fsis-thermometers
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: broil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Broiling is cooking under strong direct heat from above.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: context
      role: context
      text: In British recipes this is commonly called grilling. Thin foods and exposed toppings can colour quickly; watch the surface rather than relying only on elapsed time.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Surface browning can precede cooking through. Thick pieces may need a gentler finishing stage.
      sources:
        - cia-techniques
      review_version: 0.1
  resources:
    - resource: cia-techniques
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: brown
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Browning is heating food until its surface develops brown colour.
      sources:
        - cia-sear
      review_version: 0.1
    - id: purpose
      role: purpose
      text: The browned surface and pan deposits can add flavour to a dish. Burnt deposits taste bitter and should not be treated as desirable browning.
      sources:
        - cia-sear
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Control the heat and watch the pan as well as the food. Browning meat for a stew is a preliminary stage, not proof that its centre is cooked.
      sources:
        - cia-sear
      review_version: 0.1
  resources:
    - resource: cia-sear
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: butterfly
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Butterflying is cutting a thick piece of food almost through and opening it out while leaving a connecting hinge.
      sources:
        - goodfood-butterfly
      review_version: 0.1
    - id: purpose
      role: purpose
      text: Opening a chicken breast this way creates a thinner piece for quicker, more even cooking.
      sources:
        - goodfood-butterfly
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Slice horizontally from the thick side without severing the opposite edge, then open the two halves. Use a stable board and keep the supporting hand clear of the blade.
      sources:
        - goodfood-butterfly
      review_version: 0.1
  resources:
    - resource: goodfood-butterfly
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: dry-roast
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Dry roasting is heating food without added fat, in a dry pan or oven.
      sources:
        - gbc-toast-spices
      review_version: 0.1
    - id: uses
      role: uses
      text: Whole spices can be dry-roasted before grinding to develop their aroma.
      sources:
        - gbc-toast-spices
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Spread spices evenly and move them for even heating. Transfer them out of the hot pan once aromatic so they do not keep cooking and burn.
      sources:
        - gbc-toast-spices
      review_version: 0.1
  resources:
    - resource: gbc-toast-spices
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: glaze
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Glazing is applying or forming a glossy coating on food.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Vegetables can be finished in a little butter and a sweetener or sauce until the coating clings. Other glazes are applied directly, so the word alone does not specify one cooking method.
      sources:
        - cia-glazing
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A glaze should coat the food rather than leave it swimming in liquid. Sweet glazes need care under strong heat.
      sources:
        - cia-glazing
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
    - resource: cia-glazing
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: hard-boil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Hard-boiling eggs is cooking them in their shells in hot water until both white and yolk are firm.
      sources:
        - eggs-hard-boil
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use a tested method that specifies the starting water temperature and timing. Egg size and the hob affect the result; the name does not require a violent boil throughout.
      sources:
        - eggs-hard-boil
      review_version: 0.1
  resources:
    - resource: eggs-hard-boil
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: infuse
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Infusing is leaving a flavouring in a liquid so that flavour transfers into it.
      sources:
        - uktea-brew
      review_version: 0.1
    - id: uses
      role: uses
      text: "Tea is an everyday example: leaves steep in water and are then removed or strained out."
      sources:
        - uktea-brew
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Temperature and contact time depend on the ingredient. Follow guidance for the particular tea rather than using one brewing time for every variety.
      sources:
        - uktea-brew
      review_version: 0.1
  resources:
    - resource: uktea-brew
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: parboil
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Parboiling is partly cooking food in boiling water before a later cooking stage.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It gives food a head start before finishing by another method. Stop at the recipe’s stated stage rather than treating parboiling as the final doneness test.
      sources:
        - clubhouse-cooking-terms
      review_version: 0.1
  resources:
    - resource: clubhouse-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: pulse
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Pulsing is operating a blender or food processor in short bursts separated by stops.
      sources:
        - ka-blender-settings
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It gives closer control over chopping and mixing than leaving the motor running continuously.
      sources:
        - ka-blender-settings
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Check the texture between bursts. A pulse control does not guarantee a particular speed or particle size across different appliances.
      sources:
        - ka-blender-settings
      review_version: 0.1
  resources:
    - resource: ka-blender-settings
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: puree
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Puréeing is reducing food to a smooth paste or thick liquid.
      sources:
        - ka-blender-settings
        - kitchenaid-use
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: A blender breaks down soft ingredients; the amount of liquid and processing time affect the resulting texture.
      sources:
        - ka-blender-settings
        - kitchenaid-use
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Stop at the texture required for the dish. Use the appliance’s instructions for hot mixtures and supported ingredients.
      sources:
        - ka-blender-settings
        - kitchenaid-use
      review_version: 0.1
  resources:
    - resource: ka-blender-settings
      role: introduction
      order: 1
      review_version: 0.1
    - resource: kitchenaid-use
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: process
    id: rub-in
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Rubbing in is working solid fat into flour with the fingertips until the fat is distributed in small flour-coated pieces.
      sources:
        - bbc-rub-in
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It is used in pastry and scone doughs before adding liquid.
      sources:
        - bbc-rub-in
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Stop at the crumb texture the recipe describes. Rubbing in and creaming butter with sugar are different mixing methods.
      sources:
        - bbc-rub-in
      review_version: 0.1
  resources:
    - resource: bbc-rub-in
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: sweat
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Sweating is gently cooking vegetables in a little fat to soften them without substantial browning.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It prepares aromatic vegetables such as onion and celery as a base for other cooking.
      sources:
        - cia-techniques
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Lower the heat if the edges begin to brown. A small splash of liquid can prevent catching, but flooding the pan changes the method.
      sources:
        - cia-techniques
      review_version: 0.1
  resources:
    - resource: cia-techniques
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: autolyse
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An autolyse is a rest after mixing flour and water, before the remaining bread ingredients and further mixing are added.
      sources:
        - kab-autolyse
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It allows flour to hydrate and can make dough easier to stretch and shape with less mixing.
      sources:
        - kab-autolyse
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Water hydrates flour proteins while naturally present enzymes act on the mixture. This changes handling before active kneading begins.
      sources:
        - kab-autolyse
      review_version: 0.1
    - id: context
      role: context
      text: Strictly, the rest contains flour and water only. Some recipes include a liquid starter because its water is needed to wet the flour; follow the particular formula rather than assuming all rests are identical.
      sources:
        - kab-autolyse
      review_version: 0.1
    - id: judgement
      role: judgement
      text: The useful duration depends on the flour and formula. More resting is not automatically better, and adding a stiff starter afterwards can take extra work to distribute it evenly.
      sources:
        - kab-autolyse
      review_version: 0.1
  resources:
    - resource: kab-autolyse
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: freeze
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Freezing is cooling food until water within it forms ice.
      sources:
        - nchfp-freezing
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It preserves food by suppressing microbial activity and slowing changes in quality. It does not sterilise food or repair earlier unsafe handling.
      sources:
        - nchfp-freezing
        - foodsafe-four-steps
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Rapid, even freezing helps limit damage from ice-crystal growth. Foods differ in how well their texture survives freezing and thawing.
      sources:
        - nchfp-freezing
      review_version: 0.1
    - id: care
      role: care
      text: Use moisture-resistant packaging intended for freezing, sized for the portions needed. Ordinary glass containers are not automatically suitable for the expansion of frozen food.
      sources:
        - nchfp-freezer-containers
      review_version: 0.1
    - id: judgement
      role: judgement
      text: "Use food-specific preparation guidance: many vegetables need blanching first. Keep the freezer at the recommended temperature and plan a safe thawing method before using the food."
      sources:
        - foodsafe-four-steps
        - nchfp-blanch
      review_version: 0.1
  resources:
    - resource: nchfp-freezing
      role: introduction
      order: 1
      review_version: 0.1
    - resource: nchfp-freezer-containers
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: foodsafe-four-steps
      role: deeper-explanation
      order: 3
      review_version: 0.1
    - resource: nchfp-blanch
      role: deeper-explanation
      order: 4
      review_version: 0.1
- target:
    kind: process
    id: marinate
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Marinating is holding food in a seasoned liquid before cooking.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: purpose
      role: purpose
      text: A marinade adds flavour and may change texture. Oil, acid and seasonings are common components, but the recipe determines the mixture.
      sources:
        - fsis-brine
      review_version: 0.1
    - id: care
      role: care
      text: Marinate raw meat, poultry and seafood in the refrigerator in a food-safe container, never on the counter.
      sources:
        - foodsafe-four-steps
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Reserve a clean portion of marinade before adding raw meat if it will be used as a finishing sauce. Used raw-meat marinade must be brought to a boil before reuse; it is not a ready-to-serve sauce.
      sources:
        - fda-refrigerator
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Marinating is a preparation step. It does not replace the cooking needed to make raw meat or poultry safe.
      sources:
        - foodsafe-four-steps
      review_version: 0.1
  resources:
    - resource: fsis-brine
      role: introduction
      order: 1
      review_version: 0.1
    - resource: foodsafe-four-steps
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: fda-refrigerator
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: process
    id: pressure-cook
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Pressure cooking is cooking in a sealed vessel that holds steam above atmospheric pressure.
      sources:
        - presto-faq
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The raised pressure allows water to boil at a higher temperature, speeding many moist-heat preparations. The cooker needs the specified liquid to generate steam.
      sources:
        - presto-faq
      review_version: 0.1
    - id: uses
      role: uses
      text: "It is useful for foods such as pulses and tougher meat cuts. Time at pressure is only part of the elapsed time: heating up and releasing pressure also take time."
      sources:
        - presto-use
        - presto-faq
      review_version: 0.1
    - id: care
      role: care
      text: Follow the cooker’s manual for fill limits, vent checks and pressure release. Wait until pressure is fully reduced before opening; a stovetop cooling instruction must not be transferred to an electric cooker.
      sources:
        - presto-use
        - presto-manual
      review_version: 0.1
    - id: context
      role: context
      text: Pressure cooking a meal is not the same as pressure canning food for shelf storage. Small pressure cookers are not substitutes for a tested pressure-canning process.
      sources:
        - nchfp-pressure
      review_version: 0.1
  resources:
    - resource: presto-use
      role: introduction
      order: 1
      review_version: 0.1
    - resource: presto-faq
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: presto-manual
      role: deeper-explanation
      order: 3
      review_version: 0.1
    - resource: nchfp-pressure
      role: deeper-explanation
      order: 4
      review_version: 0.1
- target:
    kind: process
    id: temper-eggs
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Tempering eggs is gradually whisking hot liquid into beaten eggs before combining them with the remaining hot mixture.
      sources:
        - illinois-cooking-401
        - foodsafe-four-steps
        - callebaut-temper
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It reduces the abrupt heating that can produce cooked egg lumps in a custard or sauce.
      sources:
        - illinois-cooking-401
        - foodsafe-four-steps
        - callebaut-temper
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Add a little hot mixture while whisking, repeat to warm and dilute the eggs, then whisk them into the rest.
      sources:
        - illinois-cooking-401
        - foodsafe-four-steps
        - callebaut-temper
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Tempering is an intermediate step, not proof of safe cooking. Continue with the recipe’s cooking method and appropriate temperature check.
      sources:
        - illinois-cooking-401
        - foodsafe-four-steps
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: This egg-mixing technique is distinct from tempering chocolate, which controls how its fat crystallises.
      sources:
        - callebaut-temper
      review_version: 0.1
  resources:
    - resource: illinois-cooking-401
      role: introduction
      order: 1
      review_version: 0.1
    - resource: foodsafe-four-steps
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: callebaut-temper
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: process
    id: thaw
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Thawing is warming frozen food so that its ice melts.
      sources:
        - montana-safe-thaw
      review_version: 0.1
    - id: purpose
      role: purpose
      text: It prepares frozen food for handling or cooking when the recipe requires a thawed starting point.
      sources:
        - montana-safe-thaw
      review_version: 0.1
    - id: care
      role: care
      text: Plan ahead for refrigerator thawing of perishable food. Do not thaw it on the counter or in hot water.
      sources:
        - montana-safe-thaw
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: For cold-water thawing, use leak-proof packaging and change the cold water every 30 minutes. Cook promptly after cold-water or microwave thawing.
      sources:
        - montana-safe-thaw
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Large portions take longer to thaw than small ones. A soft exterior does not establish that the centre has thawed; check the preparation before proceeding.
      sources:
        - montana-safe-thaw
      review_version: 0.1
  resources:
    - resource: montana-safe-thaw
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: butter-knife
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A butter knife is a small table knife with a broad spreading blade. It is used to portion and spread butter at the table.
      sources:
        - welch-butter-knife
      review_version: 0.1
  resources:
    - resource: welch-butter-knife
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: cheesecloth
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Cheesecloth is a woven cloth used as a food strainer. It is used to drain curds, strain liquids and hold herbs or spices during cooking.
      sources:
        - kilner-muslin
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose cloth intended for food preparation with a weave suited to the task. The linked muslin cloth is a finer woven example; cloth sold under these names varies in openness.
      sources:
        - kilner-muslin
      review_version: 0.1
  resources:
    - resource: kilner-muslin
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: chopstick
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A chopstick is one of a pair of slender sticks used together as a gripping utensil. Chopsticks are used to pick up, turn, mix and serve food, as well as to eat it.
      sources:
        - kikkoman-chopsticks
      review_version: 0.1
    - id: selection
      role: selection
      text: Cooking chopsticks are generally longer than eating chopsticks. Length, tip shape and material distinguish tools for stirring, frying and precise presentation.
      sources:
        - kikkoman-chopsticks
      review_version: 0.1
  resources:
    - resource: kikkoman-chopsticks
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: coffee-filter
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A coffee filter is a porous barrier that retains coffee grounds while brewed liquid passes through. It is used in filter coffee brewing.
      sources:
        - melitta-filter-faq
      review_version: 0.1
    - id: selection
      role: selection
      text: Match the filter’s shape and size to its holder. Paper filters and reusable filters are different products; follow the brewer’s guidance.
      sources:
        - melitta-filter-faq
      review_version: 0.1
  resources:
    - resource: melitta-filter-faq
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: fork
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A fork is a handled utensil with several prongs. It is used to lift food and for small mixing tasks, such as tossing or separating cooked grains.
      sources:
        - purdue-cooking-terms
        - goodfood-rice-method
      review_version: 0.1
  resources:
    - resource: purdue-cooking-terms
      role: introduction
      order: 1
      review_version: 0.1
    - resource: goodfood-rice-method
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: jug
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A jug is a container with a handle and pouring lip or spout. It is used to hold and pour liquids during preparation and serving.
      sources:
        - pyrex-jugs
      review_version: 0.1
    - id: selection
      role: selection
      text: A marked measuring jug is one form; not every jug measures volume. Check suitability before filling any jug with hot liquid.
      sources:
        - pyrex-jugs
      review_version: 0.1
  resources:
    - resource: pyrex-jugs
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: kitchen-shears
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Kitchen shears are scissors designed for food-preparation tasks. They are used to snip ingredients and cut food or packaging.
      sources:
        - wusthof-shears
      review_version: 0.1
    - id: care
      role: care
      text: Clean the blades and joint after food contact. Separate the blades for cleaning only if the design allows it; ordinary kitchen shears are not automatically bone-cutting poultry shears.
      sources:
        - wusthof-shears
      review_version: 0.1
  resources:
    - resource: wusthof-shears
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: meat-mallet
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A meat mallet is a handled pounding tool with a heavy head. It is used to flatten meat and, with a textured face, mechanically tenderise it.
      sources:
        - oxo-meat-tenderizer
      review_version: 0.1
    - id: selection
      role: selection
      text: A flat face evens thickness; a toothed face breaks into the surface. Choose the face for the preparation rather than treating them as interchangeable.
      sources:
        - oxo-meat-tenderizer
      review_version: 0.1
  resources:
    - resource: oxo-meat-tenderizer
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: slotted-spoon
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A slotted spoon is a spoon with openings through its bowl. It is used to lift pieces of food while allowing liquid to drain back into the pan.
      sources:
        - oxo-slotted-spoon
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose openings small enough to retain the food and a material suitable for the pan and temperature.
      sources:
        - oxo-slotted-spoon
      review_version: 0.1
  resources:
    - resource: oxo-slotted-spoon
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: zester
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A zester is a small cutting or grating tool for removing the coloured surface of citrus peel. It is used to prepare aromatic zest for cooking and garnishing.
      sources:
        - microplane-zesters
        - oxo-graters
      review_version: 0.1
    - id: selection
      role: selection
      text: Rasp-style zesters make fine shavings; other designs cut narrow strips. Match the cut to the garnish or mixture you need.
      sources:
        - microplane-zesters
        - oxo-graters
      review_version: 0.1
  resources:
    - resource: microplane-zesters
      role: introduction
      order: 1
      review_version: 0.1
    - resource: oxo-graters
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: baking-dish
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A baking dish is an oven-safe container with sides that hold food during baking. It is used for dishes such as lasagne, gratins and baked desserts.
      sources:
        - kab-pans
        - goodfood-lasagne-method
      review_version: 0.1
    - id: selection
      role: selection
      text: Material and depth affect heating and the thickness of the food. Changing the dish can therefore change the result even when its stated capacity seems similar.
      sources:
        - kab-pans
        - goodfood-lasagne-method
      review_version: 0.1
    - id: care
      role: care
      text: Use the maker’s heat-source and temperature instructions. An oven-safe dish is not automatically suitable for a hob or direct grill heat.
      sources:
        - kab-pans
        - goodfood-lasagne-method
      review_version: 0.1
  resources:
    - resource: kab-pans
      role: introduction
      order: 1
      review_version: 0.1
    - resource: goodfood-lasagne-method
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: baking-paper
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Baking paper is heat-resistant non-stick paper intended for food preparation. It is used to line baking trays and tins and help release baked food.
      sources:
        - kab-parchment
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose baking parchment suited to the temperature and task. Follow the package limits; a non-stick surface does not make paper safe near a flame or exposed heating element.
      sources:
        - kab-parchment
      review_version: 0.1
  resources:
    - resource: kab-parchment
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: boston-shaker
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A Boston shaker is a two-piece cocktail shaker formed by fitting a large tin over a smaller tin or mixing glass. It is used to shake drinks with ice before straining them.
      sources:
        - difford-two-piece
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The fitted pieces form a temporary seal. Hold both securely while shaking, then release the seal before pouring through a separate strainer.
      sources:
        - difford-two-piece
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Opening the seal takes practice. Inspect glass components for damage and use pieces intended to fit together.
      sources:
        - difford-two-piece
      review_version: 0.1
  resources:
    - resource: difford-two-piece
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: cocktail-shaker
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A cocktail shaker is a closable vessel for mixing drinks by shaking. It is used to combine, chill and dilute cocktail ingredients with ice.
      sources:
        - difford-two-piece
      review_version: 0.1
    - id: selection
      role: selection
      text: Two-piece shakers need a separate strainer. Three-piece cobbler shakers include a straining section and cap; their assembly differs from a Boston shaker.
      sources:
        - difford-two-piece
      review_version: 0.1
  resources:
    - resource: difford-two-piece
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: cake-tin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A cake tin is a baking container that holds batter or dough in shape as it cooks. It is used for cakes and other baked mixtures.
      sources:
        - kab-pans
      review_version: 0.1
    - id: selection
      role: selection
      text: Match the recipe’s dimensions and depth. A wider tin makes a shallower layer, so equal capacity alone does not guarantee the same baking time.
      sources:
        - kab-pans
      review_version: 0.1
    - id: context
      role: context
      text: Material, finish and removable bases vary. Use the recipe’s preparation instructions for greasing or lining the particular tin.
      sources:
        - kab-pans
      review_version: 0.1
  resources:
    - resource: kab-pans
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: double-boiler
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A double boiler is a pair of nested vessels with water below and food in the upper vessel. It is used to heat delicate mixtures such as custards and chocolate indirectly.
      sources:
        - illinois-cooking-401
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The upper vessel sits above simmering water. A supported heatproof bowl over a saucepan can also provide indirect heat.
      sources:
        - illinois-cooking-401
      review_version: 0.1
    - id: care
      role: care
      text: Keep water below the upper vessel. Handle the hot bowl and escaping steam carefully.
      sources:
        - illinois-cooking-401
      review_version: 0.1
  resources:
    - resource: illinois-cooking-401
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: mesh-strainer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A mesh strainer is a supported mesh bowl or screen through which liquid or fine particles can pass. It is used to strain liquids, rinse small foods and sift dry ingredients.
      sources:
        - oxo-sieve
      review_version: 0.1
    - id: selection
      role: selection
      text: Mesh fineness determines what is retained. Choose a size that holds the food securely over the receiving bowl, and clean trapped particles from the mesh after use.
      sources:
        - oxo-sieve
      review_version: 0.1
  resources:
    - resource: oxo-sieve
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: paella-pan
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A paella pan is a broad, shallow pan with side handles. It is used to cook paella in a relatively shallow layer.
      sources:
        - garcima-paella
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose a diameter suited to the batch and heat source. Plain steel and enamelled steel versions need different care, so identify the surface before cleaning or seasoning.
      sources:
        - garcima-paella
      review_version: 0.1
  resources:
    - resource: garcima-paella
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: ramekin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A ramekin is a small individual baking dish, commonly made from ceramic. It is used for custards, small baked portions and serving.
      sources:
        - illinois-cooking-401
      review_version: 0.1
    - id: uses
      role: uses
      text: Ramekins can hold individual custards in a water bath. Match their capacity and depth to the recipe.
      sources:
        - illinois-cooking-401
      review_version: 0.1
  resources:
    - resource: illinois-cooking-401
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: silicone-spatula
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A silicone spatula is a utensil with a flexible silicone blade or head. It is used to scrape bowls, fold mixtures and stir food.
      sources:
        - oxo-silicone-spatulas
      review_version: 0.1
    - id: selection
      role: selection
      text: Blade shape and stiffness affect how it reaches corners and moves thick mixtures. Check the particular utensil’s heat rating before leaving it against a hot pan.
      sources:
        - oxo-silicone-spatulas
      review_version: 0.1
  resources:
    - resource: oxo-silicone-spatulas
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: springform-tin
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A springform tin is a baking tin with a removable base and a side ring opened by a clasp. It is used for cheesecakes and other bakes that are difficult to turn out upside down.
      sources:
        - kab-cheesecake-cracks
      review_version: 0.1
    - id: care
      role: care
      text: Fit and close the ring securely before filling. A removable joint is not automatically watertight; follow the recipe’s protection method if using a water bath.
      sources:
        - kab-cheesecake-cracks
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Let a delicate bake reach the recipe’s unmoulding stage before releasing the ring. The removable sides help release it but do not make a warm filling firm.
      sources:
        - kab-cheesecake-cracks
      review_version: 0.1
  resources:
    - resource: kab-cheesecake-cracks
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: stainless-steel-frying-pan
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A stainless-steel frying pan is a shallow pan with a stainless-steel cooking surface. It is used for frying, sautéing and searing, including dishes finished with a pan sauce.
      sources:
        - allclad-care
        - cia-sear
      review_version: 0.1
    - id: uses
      role: uses
      text: Food can leave browned deposits that are released with liquid to make a sauce. Control heat to brown those deposits without burning them.
      sources:
        - allclad-care
        - cia-sear
      review_version: 0.1
    - id: care
      role: care
      text: Let the pan cool before washing and follow its maker’s cleaning instructions. Handles, layered construction and surface treatments differ between pans.
      sources:
        - allclad-care
        - cia-sear
      review_version: 0.1
  resources:
    - resource: allclad-care
      role: introduction
      order: 1
      review_version: 0.1
    - resource: cia-sear
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: air-fryer
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An air fryer is a compact electric convection cooker with a fan that circulates hot air around food. It is used for crisping, roasting and reheating food.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: selection
      role: selection
      text: Basket models suit food that can be shaken or turned in a drawer; oven-style models use racks or trays. Usable cooking area matters as well as the stated volume.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Hot air needs access to the food. Packing the basket tightly can reduce even browning; batch size and arrangement matter.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: care
      role: care
      text: Follow the model’s instructions for clearance, cleaning and permitted accessories. Keep air paths clear and avoid treating every liner or dish as suitable.
      sources:
        - maine-air-fryer
      review_version: 0.1
    - id: judgement
      role: judgement
      text: A browned outside is not a safety test for meat or poultry. Check the internal temperature with a food thermometer.
      sources:
        - fsis-thermometers
      review_version: 0.1
  resources:
    - resource: maine-air-fryer
      role: introduction
      order: 1
      review_version: 0.1
    - resource: fsis-thermometers
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: airlock-lid
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: An airlock lid is a fermentation-vessel cover that lets gas escape while limiting outside air entry. It is used for controlled fermentation of foods such as vegetables in brine.
      sources:
        - illinois-ferment-faq
        - umn-ferment
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Fermentation produces carbon dioxide. The airlock provides a venting route without leaving the container openly exposed.
      sources:
        - illinois-ferment-faq
        - umn-ferment
      review_version: 0.1
    - id: care
      role: care
      text: Fit it to the intended vessel and follow its cleaning and operating instructions. Vegetables still need to remain under the brine.
      sources:
        - illinois-ferment-faq
        - umn-ferment
      review_version: 0.1
    - id: context
      role: context
      text: An airlock does not establish that a ferment is safe or shelf-stable. Salt, acidity, temperature and the tested food-specific method still matter.
      sources:
        - umn-ferment
      review_version: 0.1
    - id: near-neighbours
      role: near-neighbours
      text: A sealed storage lid has a different job. Do not assume an ordinary airtight lid provides the gas-release function of an airlock.
      sources:
        - illinois-ferment-faq
        - umn-ferment
      review_version: 0.1
  resources:
    - resource: illinois-ferment-faq
      role: introduction
      order: 1
      review_version: 0.1
    - resource: umn-ferment
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: carbon-steel-frying-pan
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A carbon-steel frying pan is a shallow pan made from carbon steel, commonly with a seasoned cooking surface. It is used for searing, frying and sautéing.
      sources:
        - lodge-carbon-steel
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The formed steel body is often thinner and lighter than a comparable cast-iron pan and responds more quickly to heat changes. Actual performance depends on thickness and construction.
      sources:
        - lodge-carbon-steel
      review_version: 0.1
    - id: care
      role: care
      text: Wash, dry thoroughly and apply the maker’s recommended light oil coating. Seasoning is maintained through use and care; it is not a permanent factory non-stick coating.
      sources:
        - lodge-carbon-steel
      review_version: 0.1
    - id: selection
      role: selection
      text: Check handle construction and hob or oven compatibility for the particular pan. A manufacturer’s range-wide claim does not cover every carbon-steel pan.
      sources:
        - lodge-carbon-steel
      review_version: 0.1
  resources:
    - resource: lodge-carbon-steel
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: fermentation-crock
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A fermentation crock is a large vessel designed to hold food during fermentation. It is used for foods such as sauerkraut and fermented pickles.
      sources:
        - osu-fermentation-crock
      review_version: 0.1
    - id: selection
      role: selection
      text: Open crocks and water-sealed crocks have different covers. A water-sealed design has a rim channel that holds water around the lid.
      sources:
        - osu-fermentation-crock
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: The water seal restricts outside air while allowing fermentation gas to escape. Follow the crock’s instructions for maintaining that seal.
      sources:
        - osu-fermentation-crock
      review_version: 0.1
    - id: care
      role: care
      text: Use a food-safe vessel in sound condition and suitable weights to keep vegetables submerged. Clean equipment before use.
      sources:
        - umn-ferment
      review_version: 0.1
    - id: judgement
      role: judgement
      text: The crock is only the container. Follow a tested fermentation method and assess the food’s acidity and condition; a lid or water seal alone is not a preservation process.
      sources:
        - umn-ferment
      review_version: 0.1
  resources:
    - resource: osu-fermentation-crock
      role: introduction
      order: 1
      review_version: 0.1
    - resource: umn-ferment
      role: deeper-explanation
      order: 2
      review_version: 0.1
    - resource: illinois-ferment-faq
      role: deeper-explanation
      order: 3
      review_version: 0.1
- target:
    kind: equipment
    id: mason-jar
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A Mason jar is a threaded glass jar designed to take a matching closure. It is used for home canning and food storage, with the appropriate lid and process.
      sources:
        - nchfp-jars-lids
        - nchfp-freezer-containers
      review_version: 0.1
    - id: selection
      role: selection
      text: For canning, choose purpose-made home-canning jars and the closure specified by tested guidance. Decorative jars and reused commercial jars are not equivalent merely because they have a screw thread.
      sources:
        - nchfp-jars-lids
        - nchfp-freezer-containers
      review_version: 0.1
    - id: care
      role: care
      text: Inspect rims and glass for chips or cracks. Prepare lids according to their manufacturer’s directions and use the jar size required by the tested recipe.
      sources:
        - nchfp-jars-lids
        - nchfp-freezer-containers
      review_version: 0.1
    - id: context
      role: context
      text: A closed jar is not evidence of safe shelf storage. Food, acidity, processing method and an effective seal must all be appropriate.
      sources:
        - nchfp-jars-lids
        - nchfp-freezer-containers
      review_version: 0.1
    - id: uses
      role: uses
      text: For freezing, use jars specifically suitable for that purpose and leave the required expansion space. A canning jar’s suitability for heating does not remove the need for freezing guidance.
      sources:
        - nchfp-freezer-containers
      review_version: 0.1
  resources:
    - resource: nchfp-jars-lids
      role: introduction
      order: 1
      review_version: 0.1
    - resource: nchfp-freezer-containers
      role: deeper-explanation
      order: 2
      review_version: 0.1
- target:
    kind: equipment
    id: moka-pot
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A moka pot is a coffee brewer with a lower water chamber, a coffee basket and an upper collecting chamber. It is used to brew concentrated coffee on a suitable hob.
      sources:
        - bialetti-moka-use
      review_version: 0.1
    - id: mechanism
      role: mechanism
      text: Heating the lower chamber raises pressure and drives water through the coffee into the upper chamber.
      sources:
        - bialetti-moka-use
      review_version: 0.1
    - id: care
      role: care
      text: For the linked Moka Express, keep water below the safety valve and fill the basket loosely without tamping. Use the model’s manual for assembly, inspection and heat settings.
      sources:
        - bialetti-moka-use
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Remove the pot from heat when brewing is complete rather than boiling the finished coffee. Allow it to cool before opening and cleaning.
      sources:
        - bialetti-moka-use
      review_version: 0.1
    - id: selection
      role: selection
      text: Check material and hob compatibility before use. The aluminium Moka Express described in the source is not directly induction-compatible; other designs differ.
      sources:
        - bialetti-moka-use
      review_version: 0.1
  resources:
    - resource: bialetti-moka-use
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: refrigerator
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A refrigerator is an appliance that maintains a chilled food-storage compartment. It is used to keep perishable food cold and to thaw food under controlled cold conditions.
      sources:
        - fda-refrigerator
      review_version: 0.1
    - id: care
      role: care
      text: Use an appliance thermometer to check the actual temperature; the control dial alone may not report it. FDA guidance is 40°F or below.
      sources:
        - fda-refrigerator
      review_version: 0.1
    - id: uses
      role: uses
      text: Leave space for cold air to circulate. Keep food covered and contain raw-meat drips so they cannot contaminate ready-to-eat food.
      sources:
        - fda-refrigerator
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Refrigeration slows microbial growth but does not make food keep indefinitely. Follow use-by dates and food-specific storage guidance.
      sources:
        - fda-refrigerator
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: Divide hot leftovers into smaller containers and refrigerate promptly rather than leaving a large batch on the counter to cool for hours.
      sources:
        - fda-refrigerator
      review_version: 0.1
  resources:
    - resource: fda-refrigerator
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: equipment
    id: slow-cooker
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A slow cooker is an electric appliance with a covered cooking vessel heated steadily over a long period. It is used for dishes such as stews, soups and braised meat.
      sources:
        - umd-slow-cooker
        - fsis-thermometers
      review_version: 0.1
    - id: care
      role: care
      text: Thaw meat before adding it, use a suitable recipe and follow the appliance’s fill and cooking instructions. Keep the vessel and utensils clean.
