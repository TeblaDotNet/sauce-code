- target:
    kind: equipment
    id: saucepan
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A saucepan is useful for heating liquids and making sauces. Choose a capacity that leaves room for
        stirring and bubbling.
      sources:
        - allclad-saucepans
      review_version: 0.1
    - id: selection
      role: selection
      text: Consider batch size, handle comfort, lid fit and compatibility with your hob. A suitable pot you already
        own may do the job; no single saucepan size suits every recipe.
      sources:
        - allclad-saucepans
      review_version: 0.1
    - id: context
      role: context
      text: Material and construction affect how a pan responds to heat. Treat advice for a stainless-steel model as
        advice for that product, rather than automatically applying it to coated cookware.
      sources:
        - allclad-care
      review_version: 0.1
    - id: care
      role: care
      text: Follow the manufacturer’s cleaning instructions. All-Clad recommends warm water, detergent and a sponge
        for its cookware; permitted cleaners and dishwasher use vary by collection.
      sources:
        - allclad-care
      review_version: 0.1
  resources:
    - resource: allclad-saucepans
      role: introduction
      order: 1
      review_version: 0.1
    - resource: allclad-care
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: used-for
      target:
        kind: process
        id: simmer
      note: A common vessel for gentle liquid cooking when the size suits.
      sources:
        - allclad-saucepans
      review_version: 0.1
  hero:
    asset: references/saucepan.jpg
