- target:
    kind: ingredient
    id: chicken
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Chicken is the meat of the domestic chicken, sold whole or divided into cuts such as breast and thigh.
        It is roasted, braised and used in dishes and stocks, with the cut affecting the method.
      sources:
        - fsis-chicken
      review_version: 0.1
    - id: uses
      role: uses
      text: A whole bird and separate pieces need different handling and cooking checks. Do not use a time given for
        one cut as evidence that another is cooked through.
      sources:
        - fsis-chicken
      review_version: 0.1
    - id: context
      role: context
      text: Bones and the carcass can be useful for stock; they are not simply waste. Keep this separate from the
        meat served in the finished dish, and strain the stock as the method directs.
      sources:
        - cia-stock
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Use a food thermometer rather than colour alone. USDA household guidance specifies a minimum internal
        temperature of 165°F (about 74°C); check the thickest parts and follow the linked guidance for a whole
        bird.
      sources:
        - fsis-chicken
      review_version: 0.1
    - id: storage
      role: storage
      text: Keep raw chicken refrigerated and separate from ready-to-eat foods. Prevent leaking juices from
        contaminating other food; thaw using a safe method rather than on the kitchen counter.
      sources:
        - fsis-chicken
      review_version: 0.1
    - id: mistakes
      role: mistakes
      text: A browned surface or clear-looking juices do not establish a safe internal temperature. Cooking and
        storage decisions need more than the appearance of the meat.
      sources:
        - fsis-chicken
      review_version: 0.1
  resources:
    - resource: fsis-chicken
      role: introduction
      order: 1
      review_version: 0.1
    - resource: cia-stock
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: commonly-used-with
      target:
        kind: process
        id: roast
      note: One method for a whole bird or suitable pieces.
      sources:
        - fsis-chicken
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: ingredient
        id: chicken-stock
      note: Stock is a prepared cooking liquid, not a replacement for chicken meat.
      sources:
        - cia-stock
      review_version: 0.1
- target:
    kind: ingredient
    id: coriander
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Coriander is a plant whose leaves are used as a herb and whose seeds are used as a spice. The leaves,
        whole seeds and ground seeds give different flavours and textures in cooking.
      sources:
        - usu-coriander
        - rhs-coriander
      review_version: 0.1
    - id: context
      role: context
      text: US sources commonly call the leaves cilantro and the seeds coriander. UK herb guidance uses coriander
        for the plant and its leaves as well as discussing the seeds. Look for an explicit part or preparation
        when following a recipe from another region.
      sources:
        - usu-coriander
        - rhs-coriander
      review_version: 0.1
    - id: uses
      role: uses
      text: Fresh leaves are used as a herb; seeds are harvested separately and may be used whole or ground. Do not
        replace a handful of leaves with the same amount of seed spice.
      sources:
        - rhs-coriander
      review_version: 0.1
    - id: storage
      role: storage
      text: "The forms need different storage: harvested seeds can be dried and kept in sealed containers, while
        leaves may be used fresh or preserved by freezing or drying."
      sources:
        - usu-coriander
      review_version: 0.1
    - id: selection
      role: selection
      text: Before buying or measuring, establish which form the recipe means. A chopped garnish suggests a
        different preparation from a spice ground into a mixture; if the wording still leaves doubt, ask the
        author.
      sources:
        - usu-coriander
        - rhs-coriander
      review_version: 0.1
  resources:
    - resource: usu-coriander
      role: introduction
      order: 1
      review_version: 0.1
    - resource: rhs-coriander
      role: specialist-reference
      order: 2
      review_version: 0.1
  associations:
    - relation: contrast-with
      target:
        kind: ingredient
        id: coriander-leaves
      note: The leafy herb, often called cilantro in US usage.
      sources:
        - usu-coriander
      review_version: 0.1
    - relation: contrast-with
      target:
        kind: ingredient
        id: coriander-powder
      note: Ground seed spice; not chopped fresh leaves.
      sources:
        - rhs-coriander
      review_version: 0.1
- target:
    kind: process
    id: slice
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Slice means to cut food into pieces across a surface, often of fairly even thickness. The recipe
        determines how thick.
      sources:
        - cia-knives
      review_version: 0.1
    - id: judgement
      role: judgement
      text: Keep the food stable and aim for the thickness needed; a slice need not be a cube or a fine chop.
      sources:
        - cia-knives
      review_version: 0.1
  resources:
    - resource: cia-knives
      role: introduction
      order: 1
      review_version: 0.1
- target:
    kind: process
    id: chop
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: Chop means to cut food into smaller pieces. Roughly chopped and finely chopped call for different
        results.
      sources:
        - cia-knives
      review_version: 0.1
    - id: context
      role: context
      text: The pieces need not be precise cubes. Follow any size instruction rather than treating chop, dice and
        mince as identical.
      sources:
        - cia-knives
      review_version: 0.1
  resources:
    - resource: cia-knives
      role: introduction
      order: 1
      review_version: 0.1
