- target:
    kind: equipment
    id: ladle
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A ladle scoops and serves liquids such as soup, stew or sauce. Its deep bowl carries more liquid than a
        shallow serving spoon.
      sources:
        - oxo-ladle
      review_version: 0.1
    - id: selection
      role: selection
      text: Choose a comfortable handle and a bowl size suited to the pot and serving dish. A pouring lip can help
        direct liquid; check care instructions for the actual material.
      sources:
        - oxo-ladle
      review_version: 0.1
