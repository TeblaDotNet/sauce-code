      review_version: 0.1
- target:
    kind: equipment
    id: kitchen-scale
  review_version: 0.1
  editorial:
    - id: summary
      role: summary
      text: A kitchen scale measures ingredient mass. It avoids some variation from scooping ingredients into a
        volume measure.
      sources:
        - kab-scale
      review_version: 0.1
    - id: uses
      role: uses
      text: Set a bowl on the platform and tare to zero before adding the ingredient. Taring again lets you weigh
        another addition without counting the bowl or previous ingredients.
      sources:
        - kab-scale
      review_version: 0.1
    - id: selection
      role: selection
      text: Check capacity, readability and performance with small quantities. A display with fine increments does
        not by itself guarantee reliable measurement of a tiny pinch.
      sources:
        - kab-scale
      review_version: 0.1
    - id: context
      role: context
      text: Keep weighing separate from volume conversion. A gram reading does not tell you the volume of an
        ingredient unless suitable ingredient-specific evidence is available.
      sources:
        - kab-scale
      review_version: 0.1
  resources:
    - resource: kab-scale
      role: introduction
      order: 1
      review_version: 0.1
